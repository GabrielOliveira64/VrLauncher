name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Baixar MediaPipe
        run: |
          mkdir -p app/src/main/assets/mediapipe
          npm pack @mediapipe/tasks-vision@0.10.14
          tar xzf mediapipe-tasks-vision-0.10.14.tgz
          ls package package/wasm
          cp package/vision_bundle.mjs app/src/main/assets/mediapipe/
          cp package/vision_bundle.cjs app/src/main/assets/mediapipe/ || echo "sem cjs"
          cp -r package/wasm app/src/main/assets/mediapipe/wasm
          curl -fL -o app/src/main/assets/mediapipe/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          rm -rf package mediapipe-tasks-vision-0.10.14.tgz
      - name: Gerar projeto
        run: |
          mkdir -p app/src/main/java/com/vr/launcher app/src/main/assets
          cp "$(ls *.html | head -1)" app/src/main/assets/index.html
          sed -i 's#</body>#<script src="ar.js"></script><script src="ui.js"></script><script src="hand.js"></script><script src="lean.js"></script></body>#' app/src/main/assets/index.html
          cat > app/src/main/assets/ar.js <<'EOF'
          (function () {
            var css = document.createElement('style');
            css.textContent = 'html,body,#view{background:transparent!important}.star{display:none}#cam{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:0}';
            document.head.appendChild(css);
            var v = document.createElement('video');
            v.id = 'cam'; v.autoplay = true; v.muted = true; v.setAttribute('playsinline', '');
            document.body.prepend(v);
            function msg(t, keep) {
              var d = document.createElement('div');
              d.style.cssText = 'position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(0,0,0,.8);color:#fff;font:13px sans-serif;padding:6px 12px;border-radius:999px;max-width:90%';
              d.textContent = t; document.body.appendChild(d);
              d.onclick = function () { d.remove(); };
              if (!keep) setTimeout(function () { d.remove(); }, 4000);
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg('Câmera indisponível (secure=' + window.isSecureContext + ')', true); return; }
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 960 }, height: { ideal: 540 }, frameRate: { ideal: 30 } }, audio: false })
              .then(function (s) { v.srcObject = s; v.play(); })
              .catch(function (e) { msg('Câmera: ' + e.name + ' ' + e.message, true); });
          })();
          EOF
          cat > app/src/main/assets/ui.js <<'EOF'
          (function () {
            var css = document.createElement('style');
            css.textContent = [
              '.gw{position:absolute;left:0;top:0;backface-visibility:hidden;padding:22px;border-radius:36px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 12px 48px rgba(0,0,0,.28);color:#fff;font-family:system-ui,sans-serif}',
              '.gh{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:12px;font-size:22px;font-weight:300;letter-spacing:1px}',
              '.gbs{display:flex;gap:8px}',
              '.gb{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);font-size:17px;font-weight:500;letter-spacing:0;transition:transform .12s,background .12s}',
              '.gr{display:flex;justify-content:center}',
              '.gt2{width:78px;height:92px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}',
              '.gi{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}',
              '.gl{font-size:15px;opacity:.8;white-space:nowrap}',
              '.gmin{padding:0;border-radius:50%;align-items:center;justify-content:center;font-size:44px}',
              '.p.win,.btn2{background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.3)!important;border-radius:32px!important;-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 12px 48px rgba(0,0,0,.28)!important}',
              '.p.hov{filter:none!important}',
              '.win .i{font-size:96px!important}.win .t{font-size:34px!important;font-weight:600}.win .s{font-size:22px!important}',
              '.btn2 .t{font-size:26px!important}'
            ].join('');
            document.head.appendChild(css);

            var R0 = 620, W = 720, H = 192, STEP = 78, DY = 28;
            var WS = { az: 0, el: 0, R: R0, s: 1, min: false, L: 0 };
            try {
              var sv = JSON.parse(localStorage.getItem('vrws') || 'null');
              if (sv) { WS.R = Math.max(380, Math.min(1500, sv.R || R0)); WS.s = Math.max(0.6, Math.min(2, sv.s || 1)); }
            } catch (e) {}
            function save() { try { localStorage.setItem('vrws', JSON.stringify({ R: WS.R, s: WS.s })); } catch (e) {} }

            clock.style.display = 'none';
            ring.forEach(function (r) { r.el.remove(); });
            ring.length = 0;

            var gw = mk('gw', '<div class="gh"><span id="gtime">--:--</span><div class="gbs">' +
              '<div class="gb" data-a="min">&#8212;</div><div class="gb" data-a="sm">A-</div><div class="gb" data-a="bg">A+</div>' +
              '<div class="gb" data-a="near">&#8601;</div><div class="gb" data-a="far">&#8599;</div></div></div><div class="gr"></div>');
            place(gw, 0, 0, R0, W, H);
            var bub = mk('gw gmin', '&#9638;');
            place(bub, 0, 0, R0, 96, 96);
            bub.style.display = 'none';

            var row = gw.querySelector('.gr');
            function tick() {
              var d = new Date();
              document.getElementById('gtime').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
            }
            tick(); setInterval(tick, 1000);

            APPS.forEach(function (a) {
              var t = document.createElement('div');
              t.className = 'gt2';
              t.innerHTML = '<div class="gi" style="background:linear-gradient(145deg,' + a[2] + ',' + a[3] + ')">' + a[0] + '</div><div class="gl">' + a[1] + '</div>';
              row.appendChild(t);
              ring.push({ el: t, az: 0, e: 0, hw: 5, hh: 5, fn: function () { openApp(a); } });
            });

            function put(el, az, e, r, s) {
              var x = r * Math.cos(e * D) * Math.sin(az * D), y = -r * Math.sin(e * D), z = -r * Math.cos(e * D) * Math.cos(az * D);
              el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,' + z + 'px) rotateY(' + (-az) + 'deg) rotateX(' + (-e) + 'deg) scale(' + s + ')';
            }
            var bubItem = { k: 'item', drag: true, el: bub, az: 0, e: 0, hw: 6, hh: 6, fn: function () { WS.min = false; apply(); } };
            function layout() {
              var Rn = Math.max(240, Math.min(2400, WS.R - (WS.L || 0)));
              put(gw, WS.az, WS.el, Rn, WS.s);
              put(bub, WS.az, WS.el, Rn, WS.s);
              var n = ring.length;
              ring.forEach(function (r, i) {
                var dx = (i - (n - 1) / 2) * STEP * WS.s;
                r.az = WS.az + Math.atan(dx / Rn) / D;
                r.e = WS.el - Math.atan(DY * WS.s / Rn) / D;
                r.hw = Math.atan(STEP * WS.s / 2 / Rn) / D;
                r.hh = Math.atan(48 * WS.s / Rn) / D;
              });
              bubItem.az = WS.az; bubItem.e = WS.el;
              bubItem.hw = bubItem.hh = Math.atan(48 * WS.s / Rn) / D;
            }
            setItems = function () { items = opened ? [closeItem] : (WS.min ? [bubItem] : ring); };
            function apply() {
              gw.style.display = WS.min ? 'none' : '';
              bub.style.display = WS.min ? 'flex' : 'none';
              setItems(); layout();
            }
            var acts = {
              min: function () { WS.min = true; apply(); },
              sm: function () { WS.s = Math.max(0.6, WS.s / 1.12); layout(); save(); },
              bg: function () { WS.s = Math.min(2, WS.s * 1.12); layout(); save(); },
              near: function () { WS.R = Math.max(380, WS.R - 80); layout(); save(); },
              far: function () { WS.R = Math.min(1500, WS.R + 80); layout(); save(); }
            };
            var hbtns = [];
            gw.querySelectorAll('.gb').forEach(function (b) {
              var a = b.getAttribute('data-a');
              hbtns.push({ k: 'btn', el: b, fn: acts[a], rep: a !== 'min' });
            });

            var _o = openApp, _c = closeApp;
            openApp = function (a) { _o(a); gw.style.visibility = 'hidden'; };
            closeApp = function () { _c(); gw.style.visibility = 'visible'; };

            var rcb = document.getElementById('rc');
            var oc = rcb.onclick;
            rcb.onclick = function () { if (oc) oc(); WS.az = 0; WS.el = 0; layout(); };

            window.UI = { WS: WS, layout: layout, hbtns: hbtns, winT: { k: 'win', el: gw }, save: save, bubItem: bubItem };
            apply();
          })();
          EOF
          cat > app/src/main/assets/lean.js <<'EOF'
          (function () {
            var UI = window.UI, WS = UI.WS;
            WS.L = 0;
            var G = 1400;
            var on = true, v = 0, p = 0, t0 = 0, calm = 0, w = 0, fp = null, sm = 0, lastHud = 0;

            var bar = document.getElementById('ui');
            bar.style.flexWrap = 'wrap';
            var tb = document.createElement('button'); tb.textContent = '↕ Inclinar: sim';
            var lv = document.createElement('span'); lv.textContent = '↕ 0 cm';
            bar.insertBefore(lv, bar.firstChild); bar.insertBefore(tb, bar.firstChild);
            tb.onclick = function () {
              on = !on;
              tb.textContent = on ? '↕ Inclinar: sim' : '↕ Inclinar: não';
              if (!on) { v = 0; p = 0; }
            };

            function reset() { v = 0; p = 0; calm = 0; }
            var rcb = document.getElementById('rc'), prev = rcb.onclick;
            rcb.onclick = function () { if (prev) prev(); reset(); };

            window.__a = function (x, y, z) {
              var now = performance.now(), dt = (now - t0) / 1000; t0 = now;
              if (dt <= 0.002 || dt > 0.1) { fp = null; return; }
              var f = [-Rdev[2], -Rdev[5], -Rdev[8]];
              if (fp) {
                var cx = f[1] * fp[2] - f[2] * fp[1], cy = f[2] * fp[0] - f[0] * fp[2], cz = f[0] * fp[1] - f[1] * fp[0];
                w = w * 0.7 + (Math.sqrt(cx * cx + cy * cy + cz * cz) / dt) * 0.3;
              }
              fp = f;
              if (!on) return;
              var a = -z;
              if (w > 0.9) { a = 0; v = 0; calm = 0; }
              else if (Math.abs(a) < 0.1) { a = 0; calm += dt; if (calm > 0.25) v = 0; }
              else calm = 0;
              v += a * dt; v *= Math.exp(-dt / 1.2);
              p += v * dt; p *= Math.exp(-dt / 5);
              p = Math.max(-0.35, Math.min(0.35, p));
            };

            function updOpen() {
              if (!opened) return;
              var Rw = Math.max(260, 760 - WS.L);
              place(win, closeItem.az, 0, Rw, 900, 520);
              place(closeBtn, closeItem.az, -27, Rw, 300, 100);
            }
            var _o = openApp;
            openApp = function (a) { _o(a); updOpen(); };

            function frame() {
              requestAnimationFrame(frame);
              var target = on ? p * G : 0;
              sm += (target - sm) * 0.25;
              if (Math.abs(sm - WS.L) > 0.4) { WS.L = sm; UI.layout(); updOpen(); }
              var n = performance.now();
              if (n - lastHud > 250) {
                lastHud = n;
                lv.textContent = '↕ ' + (p * 100).toFixed(0) + ' cm · rot ' + w.toFixed(1);
              }
            }
            requestAnimationFrame(frame);
          })();
          EOF
          cat > app/src/main/assets/hand-worker.js <<'EOF'
          var lm = null, del = 'GPU', M = null, model = null, vis = null, NH = 1;
          function create(d) {
            return M.HandLandmarker.createFromOptions(vis, {
              baseOptions: { modelAssetBuffer: new Uint8Array(model.slice(0)), delegate: d },
              runningMode: 'VIDEO', numHands: NH
            }).then(function (n) {
              if (lm) { try { lm.close(); } catch (e) {} }
              lm = n; del = d;
            });
          }
          function errMsg(e) { return String((e && e.message) || e); }
          self.onmessage = function (e) {
            var d = e.data;
            if (d.t === 'init') {
              try {
                self.exports = {}; self.module = { exports: self.exports };
                importScripts(d.base + '/vision_bundle.cjs');
                M = (self.module.exports && self.module.exports.FilesetResolver) ? self.module.exports : self.exports;
                if (!M.FilesetResolver) throw new Error('bundle sem FilesetResolver');
                model = d.model; NH = d.n || 1;
                M.FilesetResolver.forVisionTasks(d.base + '/wasm')
                  .then(function (v) { vis = v; return create('GPU').catch(function () { return create('CPU'); }); })
                  .then(function () { postMessage({ t: 'ready', d: del }); })
                  .catch(function (err) { postMessage({ t: 'err', m: errMsg(err) }); });
              } catch (err) { postMessage({ t: 'err', m: errMsg(err) }); }
            } else if (d.t === 'hands') {
              NH = d.n;
              if (lm) create(del).catch(function (err) { postMessage({ t: 'err', m: errMsg(err) }); });
            } else if (d.t === 'frame') {
              var t0 = performance.now();
              try {
                var r = lm.detectForVideo(d.bmp, d.ts);
                d.bmp.close();
                var hs = (r.landmarks && r.landmarks.length) ? r.landmarks.map(function (h) { return h.map(function (p) { return [p.x, p.y]; }); }) : null;
                postMessage({ t: 'res', pts: hs, ms: performance.now() - t0 });
              } catch (err) {
                try { d.bmp.close(); } catch (e2) {}
                if (del === 'GPU') {
                  create('CPU').then(function () { postMessage({ t: 'del', d: 'CPU' }); postMessage({ t: 'res', pts: null, ms: 0 }); })
                    .catch(function (e3) { postMessage({ t: 'err', m: errMsg(e3) }); });
                } else { postMessage({ t: 'err', m: errMsg(err) }); }
              }
            }
          };
          EOF
          cat > app/src/main/assets/hand.js <<'EOF'
          (function () {
            var cam = document.getElementById('cam'), UI = window.UI;
            var st2 = document.createElement('style');
            st2.textContent = [
              '#ret{display:none!important}',
              '.gt2.hand{transform:scale(1.18)}',
              '.gt2.hand .gl{opacity:1}',
              '.btn2.hand{background:rgba(255,255,255,.3)!important}',
              '.gb.hand{background:rgba(255,255,255,.5)!important;transform:scale(1.12)}',
              '.gw.hand{border-color:rgba(255,255,255,.65)}',
              '.gmin.hand{background:rgba(255,255,255,.35)}'
            ].join('');
            document.head.appendChild(st2);

            var cv = document.createElement('canvas');
            cv.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;z-index:8;pointer-events:none';
            document.body.appendChild(cv);
            var ctx = cv.getContext('2d');
            function fit() { cv.width = innerWidth; cv.height = innerHeight; }
            fit(); addEventListener('resize', fit);

            var bar = document.createElement('div');
            bar.style.cssText = 'position:fixed;top:8px;left:8px;z-index:20;display:flex;gap:6px;font:12px sans-serif;color:#fff';
            var pill = 'background:rgba(0,0,0,.6);padding:5px 10px;border-radius:999px';
            var hud = document.createElement('div'); hud.style.cssText = pill;
            var hb = document.createElement('div'); hb.style.cssText = pill; hb.textContent = '☝ 1 mão';
            bar.appendChild(hud); bar.appendChild(hb); document.body.appendChild(bar);
            var msgText = 'Mão: carregando IA…';
            function say(t) { msgText = t; hud.textContent = t; }
            say(msgText);

            var CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

            var Mod = null, vision = null, lm = null, delegate = 'GPU', busy = false, nh = 1;
            var worker = null, wReady = false, wBusy = false, wErr = 0, mode = 'init';
            var skelT = null, skelC = null, pw = null, tx = 0, ty = 0, cx = 0, cy = 0, first = true, hsA = 0;
            var pinch = false, pinchN = 0, pinchTarget = null, clicked = false, lastFire = 0, grab = null, cur = null;
            var seen = 0, lastDet = 0, lastT = 0, fpsAvg = 0, msAvg = 0, lastFrame = performance.now(), pfAvg = 30, lastHud = 0;
            window.handCursor = { x: 0, y: 0, pinch: false, has: false };

            var _fire = fire;
            fire = function () { dwell = -0.8; };

            function map(p) {
              var vw = cam.videoWidth, vh = cam.videoHeight, W = cv.width, H = cv.height;
              var s = Math.max(W / vw, H / vh);
              return { x: p.x * vw * s - (vw * s - W) / 2, y: p.y * vh * s - (vh * s - H) / 2 };
            }
            function dist(a, b) { return Math.hypot((a.x - b.x) * cam.videoWidth, (a.y - b.y) * cam.videoHeight); }
            function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

            function hitTarget(x, y) {
              var best = null, bd = 1e9;
              function test(t, pad) {
                var r = t.el.getBoundingClientRect();
                if (r.width < 1) return;
                if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) {
                  var d = Math.hypot(x - (r.left + r.right) / 2, y - (r.top + r.bottom) / 2);
                  if (d < bd) { bd = d; best = t; }
                }
              }
              var closed = !opened && !UI.WS.min;
              items.forEach(function (t) { test(t, 12); });
              if (closed) UI.hbtns.forEach(function (t) { test(t, 8); });
              if (!best && closed) test(UI.winT, 14);
              return best;
            }

            async function create(del) {
              var n = await Mod.HandLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: 'mediapipe/hand_landmarker.task', delegate: del },
                runningMode: 'VIDEO', numHands: nh
              });
              if (lm) { try { lm.close(); } catch (e) {} }
              lm = n; delegate = del;
            }
            async function initMain() {
              try {
                if (!Mod) {
                  Mod = await import('./mediapipe/vision_bundle.mjs');
                  vision = await Mod.FilesetResolver.forVisionTasks('mediapipe/wasm');
                }
                try { await create('GPU'); } catch (e) { await create('CPU'); }
                msgText = '';
              } catch (e) { say('Mão: erro ' + (e.message || e)); }
            }
            function fallback(why) {
              if (mode === 'main') return;
              mode = 'main';
              if (worker) { try { worker.terminate(); } catch (e) {} worker = null; }
              wReady = false; wBusy = false;
              say('Worker indisponível (' + why + '). Usando thread principal…');
              initMain();
            }
            function startWorker() {
              var t = setTimeout(function () { fallback('timeout'); }, 20000);
              try { worker = new Worker('hand-worker.js'); }
              catch (e) { clearTimeout(t); return fallback('Worker: ' + e.message); }
              worker.onerror = function () { clearTimeout(t); fallback('erro no worker'); };
              worker.onmessage = function (e) {
                var d = e.data;
                if (d.t === 'ready') { clearTimeout(t); wReady = true; delegate = d.d; mode = 'worker'; msgText = ''; }
                else if (d.t === 'res') {
                  wBusy = false; wErr = 0;
                  var hs = d.pts ? d.pts.map(function (h) { return h.map(function (q) { return { x: q[0], y: q[1] }; }); }) : null;
                  onHand(hs, performance.now(), d.ms);
                }
                else if (d.t === 'del') { delegate = d.d; }
                else if (d.t === 'err') { clearTimeout(t); wBusy = false; if (!wReady || ++wErr >= 3) fallback(d.m); }
              };
              fetch('mediapipe/hand_landmarker.task')
                .then(function (r) { return r.arrayBuffer(); })
                .then(function (buf) { worker.postMessage({ t: 'init', model: buf, n: nh, base: location.origin + '/mediapipe' }, [buf]); })
                .catch(function (e) { clearTimeout(t); fallback('modelo: ' + e.message); });
            }
            function sendFrame() {
              var w = 480, h = Math.round(480 * cam.videoHeight / cam.videoWidth);
              createImageBitmap(cam, { resizeWidth: w, resizeHeight: h, resizeQuality: 'low' })
                .then(function (b) { if (worker) worker.postMessage({ t: 'frame', bmp: b, ts: lastDet }, [b]); else b.close(); })
                .catch(function () { wBusy = false; });
            }
            function detectMain(now) {
              var res, t0 = performance.now();
              try { res = lm.detectForVideo(cam, now); }
              catch (e) {
                if (delegate === 'GPU') {
                  busy = true; say('GPU falhou, usando CPU…');
                  create('CPU').then(function () { msgText = ''; }).catch(function (e2) { say('Mão: erro ' + (e2.message || e2)); }).then(function () { busy = false; });
                } else { say('Mão: erro ' + (e.message || e)); }
                return;
              }
              onHand((res.landmarks && res.landmarks.length) ? res.landmarks : null, now, performance.now() - t0);
            }

            hud.onclick = async function () {
              if (mode === 'worker') { fallback('manual'); return; }
              if (!lm || busy) return;
              var d = delegate === 'GPU' ? 'CPU' : 'GPU';
              busy = true; say('Mão: trocando para ' + d + '…');
              try { await create(d); msgText = ''; } catch (e) { say('Erro ' + d + ': ' + (e.message || e)); }
              busy = false;
            };
            hb.onclick = function () {
              nh = nh === 1 ? 2 : 1;
              hb.textContent = nh === 1 ? '☝ 1 mão' : '✌ 2 mãos';
              if (mode === 'worker' && worker) worker.postMessage({ t: 'hands', n: nh });
              else if (mode === 'main' && lm && !busy) {
                busy = true;
                create(delegate).catch(function (e) { say('Mão: erro ' + (e.message || e)); }).then(function () { busy = false; });
              }
            };

            function onHand(hands, now, ms) {
              if (ms != null) msAvg = msAvg * 0.8 + ms * 0.2;
              if (lastT) fpsAvg = fpsAvg ? fpsAvg * 0.8 + (1000 / (now - lastT)) * 0.2 : 1000 / (now - lastT);
              lastT = now;
              if (hands && hands.length) {
