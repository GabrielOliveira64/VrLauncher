          package com.vr.launcher;
          import android.os.SystemClock;
          import android.view.InputDevice;
          import android.view.InputEvent;
          import android.view.MotionEvent;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.lang.reflect.Method;
          public class ShellService extends IShell.Stub {
            Object im; Method inject, setDisp; String err = "ok"; long downTime = 0;
            public ShellService() {
              try {
                Class<?> c = Class.forName("android.hardware.input.InputManager");
                im = c.getMethod("getInstance").invoke(null);
                inject = c.getMethod("injectInputEvent", InputEvent.class, int.class);
                setDisp = InputEvent.class.getMethod("setDisplayId", int.class);
              } catch (Throwable t) { err = String.valueOf(t); }
            }
            @Override public void destroy() { System.exit(0); }
            @Override public String run(String cmd) {
              try {
                Process p = new ProcessBuilder("sh", "-c", cmd).redirectErrorStream(true).start();
                BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                StringBuilder sb = new StringBuilder(); String l;
                while ((l = r.readLine()) != null) sb.append(l).append('\n');
                p.waitFor();
                return sb.toString();
              } catch (Throwable t) { return "Error: " + t; }
            }
            @Override public String info() { return err; }
            @Override public void touch(int a, float x, float y, int d) {
              if (inject == null) return;
              try {
                long now = SystemClock.uptimeMillis();
                if (a == 0) downTime = now;
                MotionEvent e = MotionEvent.obtain(downTime, now, a, x, y, a == 1 ? 0f : 1f, 1f, 0, 1f, 1f, 0, 0);
                e.setSource(InputDevice.SOURCE_TOUCHSCREEN);
                setDisp.invoke(e, d);
                inject.invoke(im, e, 0);
                e.recycle();
              } catch (Throwable t) { err = String.valueOf(t); }
            }
          }
