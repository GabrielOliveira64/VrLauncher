            void applyRects(String s) {
              for (String part : s.split(";")) {
                String[] a = part.split(",");
                if (a.length < 9) continue;
                try {
                  Win w = find(Integer.parseInt(a[0]));
                  if (w == null) continue;
                  w.cx = Float.parseFloat(a[1]) * sx(); w.cy = Float.parseFloat(a[2]) * sy();
                  w.w = Float.parseFloat(a[3]) * sx(); w.h = Float.parseFloat(a[4]) * sx();
                  w.rot = Float.parseFloat(a[5]);
                  int pw = Integer.parseInt(a[6]), ph = Integer.parseInt(a[7]);
                  float al = Float.parseFloat(a[8]);
                  if (a.length > 9) { int cc = Integer.parseInt(a[9]); if (cc != w.corner) { w.corner = cc; w.v.invalidateOutline(); } }
                  if (pw != w.pw || ph != w.ph) { w.pw = pw; w.ph = ph; w.v.setLayoutParams(new FrameLayout.LayoutParams(pw, ph)); }
                  if (w.w > 1f) {
                    w.v.setPivotX(w.pw / 2f); w.v.setPivotY(w.ph / 2f);
                    w.v.setTranslationX(w.cx - w.pw / 2f); w.v.setTranslationY(w.cy - w.ph / 2f);
                    w.v.setScaleX(w.w / w.pw); w.v.setScaleY(w.h / w.ph);
                    w.v.setRotation(w.rot);
                    w.v.setAlpha(al);
                    w.v.setVisibility(View.VISIBLE);
                  } else {
                    w.v.setVisibility(View.INVISIBLE);
                  }
                } catch (Exception e) { }
              }
            }
            void setDrag(String s) {
              try {
                if (s == null || s.length() < 5) { curv.tg = null; curv.dg = null; curv.side = 0; curv.invalidate(); return; }
                String[] parts = s.split(";");
                String[] a = parts[0].split(",");
                curv.tg = new float[]{ Float.parseFloat(a[0]) * sx(), Float.parseFloat(a[1]) * sy(), Float.parseFloat(a[2]) * sx(), Float.parseFloat(a[3]) * sx(), Float.parseFloat(a[4]) };
                curv.side = Integer.parseInt(a[5]);
                curv.dg = null;
                if (parts.length > 1 && parts[1].length() > 3) {
                  String[] b = parts[1].split(",");
                  curv.dg = new float[]{ Float.parseFloat(b[0]) * sx(), Float.parseFloat(b[1]) * sy(), Float.parseFloat(b[2]) * sx(), Float.parseFloat(b[3]) * sx() };
                }
              } catch (Exception e) { curv.tg = null; curv.dg = null; curv.side = 0; }
              curv.invalidate();
            }
            float[] loc(Win w, float x, float y) {
              double r = Math.toRadians(w.rot);
              float c = (float) Math.cos(r), s = (float) Math.sin(r);
              float dx = x - w.cx, dy = y - w.cy;
              return new float[]{dx * c + dy * s, -dx * s + dy * c};
            }
            boolean inside(Win w, float x, float y) {
              float[] l = loc(w, x, y);
              return Math.abs(l[0]) <= w.w / 2f && Math.abs(l[1]) <= w.h / 2f;
            }
            void send(Win w, int action, float x, float y) {
              if (w.w < 1f) return;
              float[] l = loc(w, x, y);
              float k = w.w / w.pw;
              float px = clamp(l[0] / k + w.pw / 2f, 0f, w.pw - 1f);
              float py = clamp(l[1] / k + w.ph / 2f, 0f, w.ph - 1f);
              long now = SystemClock.uptimeMillis();
              if (action == MotionEvent.ACTION_DOWN) downTime = now;
              MotionEvent e = MotionEvent.obtain(downTime, now, action, px, py, 0);
              e.setSource(InputDevice.SOURCE_TOUCHSCREEN);
              w.v.dispatchTouchEvent(e);
              e.recycle();
            }
            void onCursor(float x, float y, boolean pinch, boolean has) {
              float cx = x * sx(), cy = y * sy();
              Win hit = null;
              if (has) {
                for (int i = wins.size() - 1; i >= 0; i--) {
                  Win w = wins.get(i);
                  if (w.w > 1f && w.v.getVisibility() == View.VISIBLE && inside(w, cx, cy)) { hit = w; break; }
                }
              }
              curv.x = cx; curv.y = cy; curv.pinch = pinch;
              curv.show = has && (hit != null || down != null);
              curv.postInvalidate();
              if (down != null) {
                if (pinch && has) { lastX = cx; lastY = cy; send(down, MotionEvent.ACTION_MOVE, cx, cy); }
                else { Win w = down; down = null; send(w, MotionEvent.ACTION_UP, lastX, lastY); }
              } else {
                boolean was = pinchPrev; pinchPrev = pinch && has;
                if (!(pinch && has)) armed = true; else if (!was) armed = (hit != null);
                if (pinch && has && armed && hit != null) {
                  down = hit; lastX = cx; lastY = cy;
                  frontWin(hit.id);
                  send(hit, MotionEvent.ACTION_DOWN, cx, cy);
                }
              }
            }

            /* ---------- biblioteca espacial: importar / listar / apagar ---------- */
            int spCnt = 0; String spNote = "";
            boolean spDel(String id) {
              if (id == null || !id.matches("[0-9]+")) return false;
              File dir = new File(getFilesDir(), "spatial");
              boolean ok = false;
              String[] sf = { ".jpg", ".mp4", "_t.jpg", ".txt" };
              for (String s : sf) { File f = new File(dir, id + s); if (f.exists() && f.delete()) ok = true; }
              return ok;
            }
            void spPick() {
              try {
                Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                i.addCategory(Intent.CATEGORY_OPENABLE);
                i.setType("*/*");
