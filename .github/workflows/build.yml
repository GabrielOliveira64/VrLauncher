              barTex = bitmapTex(makeBar());
              cornerTex = bitmapTex(makeCorner());
              plusTex = bitmapTex(makePlus());
              roundTex = bitmapTex(makeRound());

              // contexto GL novo (raro): refaz as texturas das janelas que ja existiam
              for (Win w : wins) {
