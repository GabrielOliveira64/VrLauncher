              '.kbb svg{width:34px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}',
              '.aw.kt .kbb{background:#5eead4;color:#04201c}',
              '.aw .kbb.hand{background:#fff;color:#000}'""")
          patch(U, """W.dom = mk2('aw', '<div class="rh"></div><div class="bar"></div>');""", """W.dom = mk2('aw', '<div class="rh"></div><div class="bar"></div><div class="kbb"><svg viewBox="0 0 30 22"><rect x="1.5" y="3" width="27" height="16" rx="3"/><path d="M7 8h2M12 8h2M17 8h2M22 8h2M9 13h12"/></svg></div>');""")
          patch(U, "W.barT = { k: 'win', w: W.mv, el: W.bar };", "W.barT = { k: 'win', w: W.mv, el: W.bar };\n              W.kb = W.dom.querySelector('.kbb'); W.kbT = { k: 'btn', el: W.kb, fn: function () { if (window.KB) window.KB.toggle(W); } };")
          patch(U, "WINS.forEach(function (W) { if (W.min) t.push(W.bubT); else if (!W.grp) t.push(W.barT); });", "WINS.forEach(function (W) { if (W.min) t.push(W.bubT); else { if (!W.grp) t.push(W.barT); t.push(W.kbT); } });")
