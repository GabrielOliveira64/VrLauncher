name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Baixar MediaPipe
        run: |
          mkdir -p app/src/main/assets/mediapipe
          npm pack @mediapipe/tasks-vision@0.10.14
          tar xzf mediapipe-tasks-vision-0.10.14.tgz
          ls package package/wasm
          cp package/vision_bundle.mjs app/src/main/assets/mediapipe/
          cp -r package/wasm app/src/main/assets/mediapipe/wasm
          curl -fL -o app/src/main/assets/mediapipe/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          rm -rf package mediapipe-tasks-vision-0.10.14.tgz
      - name: Gerar projeto
        run: |
          mkdir -p app/src/main/java/com/vr/launcher app/src/main/assets
          cp "$(ls *.html | head -1)" app/src/main/assets/index.html
          sed -i 's#</body>#<script src="ar.js"></script><script src="ui.js"></script><script src="hand.js"></script></body>#' app/src/main/assets/index.html
          cat > app/src/main/assets/ar.js <<'EOF'
          (function () {
            var css = document.createElement('style');
            css.textContent = 'html,body,#view{background:transparent!important}.star{display:none}#cam{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:0}';
            document.head.appendChild(css);
            var v = document.createElement('video');
            v.id = 'cam'; v.autoplay = true; v.muted = true; v.setAttribute('playsinline', '');
            document.body.prepend(v);
            function msg(t, keep) {
              var d = document.createElement('div');
              d.style.cssText = 'position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(0,0,0,.8);color:#fff;font:13px sans-serif;padding:6px 12px;border-radius:999px;max-width:90%';
              d.textContent = t; document.body.appendChild(d);
              d.onclick = function () { d.remove(); };
              if (!keep) setTimeout(function () { d.remove(); }, 4000);
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg('Câmera indisponível (secure=' + window.isSecureContext + ')', true); return; }
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
              .then(function (s) { v.srcObject = s; v.play(); })
              .catch(function (e) { msg('Câmera: ' + e.name + ' ' + e.message, true); });
          })();
          EOF
          cat > app/src/main/assets/ui.js <<'EOF'
          (function () {
            var css = document.createElement('style');
            css.textContent = [
              '.gw{position:absolute;left:0;top:0;backface-visibility:hidden;padding:22px;border-radius:36px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 12px 48px rgba(0,0,0,.28);color:#fff;font-family:system-ui,sans-serif}',
              '.gh{height:28px;margin-bottom:12px;font-size:22px;font-weight:300;letter-spacing:1px;opacity:.9}',
              '.gr{display:flex;justify-content:center}',
              '.gt2{width:78px;height:92px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}',
              '.gi{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}',
              '.gl{font-size:15px;opacity:.8;white-space:nowrap}',
              '.gt2.hov{transform:scale(1.14)}',
              '.gt2.hov .gl{opacity:1}',
              '.p.win,.btn2{background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.3)!important;border-radius:32px!important;-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 12px 48px rgba(0,0,0,.28)!important}',
              '.p.hov{filter:none!important}',
              '.win .i{font-size:96px!important}.win .t{font-size:34px!important;font-weight:600}.win .s{font-size:22px!important}',
              '.btn2 .t{font-size:26px!important}.btn2.hov{background:rgba(255,255,255,.3)!important}'
            ].join('');
            document.head.appendChild(css);

            var R0 = 620, W = 720, H = 176, STEP = 78, DY = 20;
            clock.style.display = 'none';
            ring.forEach(function (r) { r.el.remove(); });
            ring.length = 0;

            var gw = mk('gw', '<div class="gh"><span id="gtime">--:--</span></div><div class="gr"></div>');
            place(gw, 0, 0, R0, W, H);
            var row = gw.querySelector('.gr');
            function tick() {
              var d = new Date();
              document.getElementById('gtime').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
            }
            tick(); setInterval(tick, 1000);

            var n = APPS.length;
            APPS.forEach(function (a, i) {
              var t = document.createElement('div');
              t.className = 'gt2';
              t.innerHTML = '<div class="gi" style="background:linear-gradient(145deg,' + a[2] + ',' + a[3] + ')">' + a[0] + '</div><div class="gl">' + a[1] + '</div>';
              row.appendChild(t);
              var dx = (i - (n - 1) / 2) * STEP;
              ring.push({
                el: t,
                az: Math.atan(dx / R0) / D,
                e: -Math.atan(DY / R0) / D,
                hw: Math.atan((STEP / 2) / R0) / D,
                hh: Math.atan(48 / R0) / D,
                fn: function () { openApp(a); }
              });
            });

            var _o = openApp, _c = closeApp;
            openApp = function (a) { _o(a); gw.style.visibility = 'hidden'; };
            closeApp = function () { _c(); gw.style.visibility = 'visible'; };
          })();
          EOF
          cat > app/src/main/assets/hand.js <<'EOF'
          (function () {
            var cam = document.getElementById('cam');
            var cv = document.createElement('canvas');
            cv.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;z-index:8;pointer-events:none';
            document.body.appendChild(cv);
            var ctx = cv.getContext('2d');
            function fit() { cv.width = innerWidth; cv.height = innerHeight; }
            fit(); addEventListener('resize', fit);

            var hud = document.createElement('div');
            hud.style.cssText = 'position:fixed;top:8px;left:8px;z-index:20;background:rgba(0,0,0,.6);color:#fff;font:12px sans-serif;padding:5px 10px;border-radius:999px';
            document.body.appendChild(hud);
            function say(t) { hud.textContent = t; }
            say('Mão: carregando IA…');

            var Mod = null, vision = null, lm = null, delegate = 'GPU', busy = false;
            var pinch = false, fpsAvg = 0, msAvg = 0, lastDet = 0, lastT = 0, sx = 0, sy = 0, first = true;
            window.handCursor = { x: 0, y: 0, pinch: false, has: false };

            async function create(del) {
              var n = await Mod.HandLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: 'mediapipe/hand_landmarker.task', delegate: del },
                runningMode: 'VIDEO', numHands: 1
              });
              if (lm) { try { lm.close(); } catch (e) {} }
              lm = n; delegate = del;
            }
            async function init() {
              try {
                Mod = await import('./mediapipe/vision_bundle.mjs');
                vision = await Mod.FilesetResolver.forVisionTasks('mediapipe/wasm');
                try { await create('GPU'); } catch (e) { await create('CPU'); }
                say('Mão: pronta (' + delegate + ')');
                requestAnimationFrame(loop);
              } catch (e) { say('Mão: erro ' + (e.message || e)); }
            }
            hud.onclick = async function () {
              if (!lm || busy) return;
              var d = delegate === 'GPU' ? 'CPU' : 'GPU';
              busy = true; say('Mão: trocando para ' + d + '…');
              try { await create(d); } catch (e) { say('Erro ' + d + ': ' + (e.message || e)); }
              busy = false;
            };

            function map(p) {
              var vw = cam.videoWidth, vh = cam.videoHeight, W = cv.width, H = cv.height;
              var s = Math.max(W / vw, H / vh);
              return { x: p.x * vw * s - (vw * s - W) / 2, y: p.y * vh * s - (vh * s - H) / 2 };
            }
            function dist(a, b) {
              return Math.hypot((a.x - b.x) * cam.videoWidth, (a.y - b.y) * cam.videoHeight);
            }

            function loop() {
              requestAnimationFrame(loop);
              var now = performance.now();
              if (busy || !lm || now - lastDet < 66 || cam.readyState < 2 || !cam.videoWidth) return;
              lastDet = now;
              var res;
              try {
                var t0 = performance.now();
                res = lm.detectForVideo(cam, now);
                msAvg = msAvg * 0.8 + (performance.now() - t0) * 0.2;
              } catch (e) {
                if (delegate === 'GPU') {
                  busy = true; say('GPU falhou, usando CPU…');
                  create('CPU').catch(function (e2) { say('Mão: erro ' + (e2.message || e2)); }).then(function () { busy = false; });
                } else { say('Mão: erro ' + (e.message || e)); }
                return;
              }
              if (lastT) { fpsAvg = fpsAvg ? fpsAvg * 0.8 + (1000 / (now - lastT)) * 0.2 : 1000 / (now - lastT); }
              lastT = now;

              ctx.clearRect(0, 0, cv.width, cv.height);
              var hs = res.landmarks && res.landmarks[0];
              if (hs) {
                var pts = hs.map(map);
                ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
                Mod.HandLandmarker.HAND_CONNECTIONS.forEach(function (c) {
                  ctx.beginPath(); ctx.moveTo(pts[c.start].x, pts[c.start].y); ctx.lineTo(pts[c.end].x, pts[c.end].y); ctx.stroke();
                });
                ctx.fillStyle = 'rgba(255,255,255,.9)';
                pts.forEach(function (p) { ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 6.283); ctx.fill(); });

                var ratio = dist(hs[4], hs[8]) / (dist(hs[0], hs[9]) || 1);
                pinch = pinch ? ratio < 0.40 : ratio < 0.25;
                var t = pts[8];
                if (first) { sx = t.x; sy = t.y; first = false; }
                sx += (t.x - sx) * 0.5; sy += (t.y - sy) * 0.5;
                ctx.lineWidth = 3;
                ctx.strokeStyle = pinch ? '#5eead4' : '#ffffff';
                ctx.fillStyle = pinch ? '#5eead4' : '#ffffff';
                ctx.beginPath(); ctx.arc(sx, sy, 16, 0, 6.283); ctx.stroke();
                ctx.beginPath(); ctx.arc(sx, sy, 5, 0, 6.283); ctx.fill();
                window.handCursor = { x: sx, y: sy, pinch: pinch, has: true };
              } else {
                first = true; pinch = false;
                window.handCursor = { x: 0, y: 0, pinch: false, has: false };
              }
              say('Mão: ' + Math.round(fpsAvg) + ' fps · ' + Math.round(msAvg) + ' ms · ' + delegate + (hs ? '' : ' · sem mão'));
            }
            init();
          })();
          EOF
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VRLauncher"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.vr.launcher'
            compileSdk 34
            defaultConfig {
              applicationId 'com.vr.launcher'
              minSdk 24
              targetSdk 34
              versionCode 5
              versionName '1.4'
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-feature android:name="android.hardware.camera" android:required="false"/>
            <application android:label="VR Launcher" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true"
                android:screenOrientation="sensorLandscape"
                android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/vr/launcher/MainActivity.java <<'EOF'
          package com.vr.launcher;
          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.InputStream;
          public class MainActivity extends Activity implements SensorEventListener {
            static final String HOST = "appassets.androidplatform.net";
            static final String HOOK = "window.__r=function(a){Rdev=a;if(!haveSensor){haveSensor=true;haveGyro=true;mode='gyro';setTimeout(recenter,200)}if(st.textContent!=='Sensor nativo OK')st.textContent='Sensor nativo OK'};";
            WebView web; SensorManager sm; Sensor rot; boolean ready = false;
            PermissionRequest pending = null;
            float[] m = new float[9];
            boolean hasCam() {
              return checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED;
            }
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              web = new WebView(this);
              web.setBackgroundColor(Color.TRANSPARENT);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              web.setWebChromeClient(new WebChromeClient() {
                @Override public void onPermissionRequest(final PermissionRequest r) {
                  runOnUiThread(new Runnable() { public void run() {
                    if (hasCam()) { r.grant(r.getResources()); }
                    else { pending = r; requestPermissions(new String[]{Manifest.permission.CAMERA}, 1); }
                  }});
                }
              });
              web.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if (!HOST.equals(u.getHost())) return null;
                  String p = u.getPath();
                  if (p == null || p.equals("/")) p = "/index.html";
                  try {
                    InputStream in = getAssets().open(p.substring(1));
                    String mime = "text/html";
                    String enc = "UTF-8";
                    if (p.endsWith(".js") || p.endsWith(".mjs")) mime = "application/javascript";
                    else if (p.endsWith(".wasm")) { mime = "application/wasm"; enc = null; }
                    else if (p.endsWith(".task")) { mime = "application/octet-stream"; enc = null; }
                    return new WebResourceResponse(mime, enc, in);
                  } catch (Exception e) { return null; }
                }
                @Override public void onPageFinished(WebView v, String u) {
                  v.evaluateJavascript(HOOK, null);
                  ready = true;
                }
              });
              setContentView(web);
              if (!hasCam()) requestPermissions(new String[]{Manifest.permission.CAMERA}, 1);
              web.loadUrl("https://" + HOST + "/index.html");
              sm = (SensorManager) getSystemService(SENSOR_SERVICE);
              rot = sm.getDefaultSensor(Sensor.TYPE_GAME_ROTATION_VECTOR);
              if (rot == null) rot = sm.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR);
            }
            @Override public void onRequestPermissionsResult(int c, String[] p, int[] res) {
              if (pending != null) {
                if (res.length > 0 && res[0] == PackageManager.PERMISSION_GRANTED) pending.grant(pending.getResources());
                else pending.deny();
                pending = null;
              }
            }
            @Override public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) web.setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
            }
            @Override protected void onResume() {
              super.onResume();
              if (rot != null) sm.registerListener(this, rot, SensorManager.SENSOR_DELAY_GAME);
            }
            @Override protected void onPause() {
              super.onPause();
              sm.unregisterListener(this);
            }
            @Override public void onSensorChanged(SensorEvent e) {
              if (!ready) return;
              SensorManager.getRotationMatrixFromVector(m, e.values);
              StringBuilder sb = new StringBuilder("__r([");
              for (int i = 0; i < 9; i++) { sb.append(m[i]); if (i < 8) sb.append(','); }
              sb.append("])");
              web.evaluateJavascript(sb.toString(), null);
            }
            @Override public void onAccuracyChanged(Sensor s, int a) {}
          }
          EOF
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VRLauncher
          path: app/build/outputs/apk/debug/app-debug.apk
