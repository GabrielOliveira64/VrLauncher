            } catch (e) {}
            function save() { try { localStorage.setItem('vrws', JSON.stringify({ R: HUB.R, s: HUB.s })); } catch (e) {} }

            var WS = { L: 0 };
            var WINS = [], nextId = 1, T_hub = [], hubBtns = [];

            function sz(el, w, h) {
