            void spImportOne(Uri u) throws Exception {
              String name = "imagem";
              Cursor c = getContentResolver().query(u, new String[]{OpenableColumns.DISPLAY_NAME}, null, null, null);
              if (c != null) { try { if (c.moveToFirst() && c.getString(0) != null) name = c.getString(0); } finally { c.close(); } }
              String low = name.toLowerCase();
              String mt = getContentResolver().getType(u);
              boolean vid = (mt != null && mt.startsWith("video/")) || low.endsWith(".mp4") || low.endsWith(".m4v");
              int dot = name.lastIndexOf('.'); if (dot > 0) name = name.substring(0, dot);
              if (vid) { spImportVideo(u, name); return; }
              BitmapFactory.Options o = new BitmapFactory.Options(); o.inJustDecodeBounds = true;
              InputStream in = getContentResolver().openInputStream(u);
              try { BitmapFactory.decodeStream(in, null, o); } finally { if (in != null) in.close(); }
              if (o.outWidth <= 0 || o.outHeight <= 0) throw new Exception("formato não suportado (use JPG ou PNG)");
              int tw = o.outWidth >= 3072 ? 4096 : (o.outWidth >= 1536 ? 2048 : 1024), th = tw / 2;
              int ss = 1; while (o.outWidth / (ss * 2) >= tw) ss *= 2;
              BitmapFactory.Options o2 = new BitmapFactory.Options(); o2.inSampleSize = ss;
              Bitmap b;
              in = getContentResolver().openInputStream(u);
              try { b = BitmapFactory.decodeStream(in, null, o2); } finally { if (in != null) in.close(); }
              if (b == null) throw new Exception("não consegui ler a imagem");
              Bitmap s = (b.getWidth() == tw && b.getHeight() == th) ? b : Bitmap.createScaledBitmap(b, tw, th, true);
              if (s != b) b.recycle();
              File dir = new File(getFilesDir(), "spatial"); dir.mkdirs();
              String id = String.valueOf(System.currentTimeMillis() * 10 + (spCnt++ % 10));
              FileOutputStream fo = new FileOutputStream(new File(dir, id + ".jpg"));
              try { s.compress(Bitmap.CompressFormat.JPEG, 90, fo); } finally { fo.close(); }
              Bitmap t = Bitmap.createScaledBitmap(s, 320, 160, true);
              fo = new FileOutputStream(new File(dir, id + "_t.jpg"));
              try { t.compress(Bitmap.CompressFormat.JPEG, 80, fo); } finally { fo.close(); }
              fo = new FileOutputStream(new File(dir, id + ".txt"));
              try { fo.write(name.getBytes("UTF-8")); } finally { fo.close(); }
              t.recycle(); s.recycle();
            }
            void spImportVideo(Uri u, String name) throws Exception {
              File dir = new File(getFilesDir(), "spatial"); dir.mkdirs();
              String id = String.valueOf(System.currentTimeMillis() * 10 + (spCnt++ % 10));
              File out = new File(dir, id + ".mp4");
              boolean okv = false;
              try {
                InputStream in = getContentResolver().openInputStream(u);
                if (in == null) throw new Exception("não consegui abrir o arquivo");
                FileOutputStream fo = new FileOutputStream(out);
                try { byte[] buf = new byte[65536]; int n; while ((n = in.read(buf)) > 0) fo.write(buf, 0, n); }
                finally { fo.close(); in.close(); }
                android.media.MediaMetadataRetriever mr = new android.media.MediaMetadataRetriever();
                Bitmap fr = null; int vw = 0;
                try {
                  mr.setDataSource(out.getAbsolutePath());
                  String ws = mr.extractMetadata(android.media.MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH);
                  if (ws != null) vw = Integer.parseInt(ws);
                  fr = mr.getFrameAtTime(1000000L, android.media.MediaMetadataRetriever.OPTION_CLOSEST_SYNC);
                  if (fr == null) fr = mr.getFrameAtTime();
                } finally { mr.release(); }
                if (vw <= 0) throw new Exception("não parece um vídeo MP4 válido");
                Bitmap t = fr != null ? Bitmap.createScaledBitmap(fr, 320, 160, true) : Bitmap.createBitmap(320, 160, Bitmap.Config.ARGB_8888);
                FileOutputStream fo2 = new FileOutputStream(new File(dir, id + "_t.jpg"));
                try { t.compress(Bitmap.CompressFormat.JPEG, 80, fo2); } finally { fo2.close(); }
                FileOutputStream fo3 = new FileOutputStream(new File(dir, id + ".txt"));
                try { fo3.write(name.getBytes("UTF-8")); } finally { fo3.close(); }
                if (vw > 3840) spNote = "vídeo acima de 4K pode travar neste celular";
                okv = true;
              } finally {
                if (!okv) { out.delete(); new File(dir, id + "_t.jpg").delete(); new File(dir, id + ".txt").delete(); }
              }
            }
            String spListJson() {
              JSONArray arr = new JSONArray();
              try {
                File dir = new File(getFilesDir(), "spatial");
                File[] fs = dir.listFiles();
                if (fs != null) {
                  ArrayList<String> ids = new ArrayList<>();
                  for (File f : fs) { String n = f.getName(); if (n.endsWith(".txt")) ids.add(n.substring(0, n.length() - 4)); }
                  java.util.Collections.sort(ids, java.util.Collections.reverseOrder());
                  for (String id : ids) {
                    boolean isV = new File(dir, id + ".mp4").exists();
                    if (!isV && !new File(dir, id + ".jpg").exists()) continue;
                    String nm = id;
                    try {
                      File tf = new File(dir, id + ".txt");
                      java.io.FileInputStream fi = new java.io.FileInputStream(tf);
                      byte[] bb = new byte[(int) tf.length()];
                      int rd = fi.read(bb); fi.close();
                      nm = new String(bb, 0, Math.max(rd, 0), "UTF-8");
                    } catch (Exception e) { }
                    JSONObject jo = new JSONObject(); jo.put("id", id); jo.put("name", nm); jo.put("type", isV ? "video" : "image"); arr.put(jo);
                  }
                }
              } catch (Exception e) { }
              return arr.toString();
            }

