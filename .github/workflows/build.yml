              var cx = M[0] * x + M[1] * y + M[2] * z, cy = M[3] * x + M[4] * y + M[5] * z, dep = -(M[6] * x + M[7] * y + M[8] * z);
              var S = P / R, px = innerWidth / 2 + cx * P / dep, py = innerHeight / 2 + cy * P / dep;
              var rl = Math.atan2(-M[1], M[4]) / D, ext = Math.max(KW, KH) / 2 * S * K.s;
              if (dep >= 60 && Math.abs(px - innerWidth / 2) < innerWidth / 2 + ext && Math.abs(py - innerHeight / 2) < innerHeight / 2 + ext) {
