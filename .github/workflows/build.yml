              W.btns = [];
              [].forEach.call(W.dom.querySelectorAll('.gb'), function (b) {
                var k = b.getAttribute('data-a');
                W.btns.push({ k: 'btn', el: b, fn: acts[k], rep: k === 'sm' || k === 'bg' });
              });
              WINS.push(W); winSize(W); rebuild(); layout();
              nOpen(W.id, idx);
