          cat > app/src/main/assets/hand-worker.js <<'EOF'
          var lm = null, del = 'GPU', M = null, model = null, vis = null, NH = 1;
          function create(d) {
            return M.HandLandmarker.createFromOptions(vis, {
              baseOptions: { modelAssetBuffer: new Uint8Array(model.slice(0)), delegate: d },
              runningMode: 'VIDEO', numHands: NH
            }).then(function (n) {
              if (lm) { try { lm.close(); } catch (e) {} }
              lm = n; del = d;
            });
          }
          function errMsg(e) { return String((e && e.message) || e); }
          self.onmessage = function (e) {
            var d = e.data;
            if (d.t === 'init') {
              try {
                self.exports = {}; self.module = { exports: self.exports };
                importScripts(d.base + '/vision_bundle.cjs');
                M = (self.module.exports && self.module.exports.FilesetResolver) ? self.module.exports : self.exports;
                if (!M.FilesetResolver) throw new Error('bundle sem FilesetResolver');
                model = d.model; NH = d.n || 1;
                M.FilesetResolver.forVisionTasks(d.base + '/wasm')
                  .then(function (v) { vis = v; return create('GPU').catch(function () { return create('CPU'); }); })
                  .then(function () { postMessage({ t: 'ready', d: del }); })
                  .catch(function (err) { postMessage({ t: 'err', m: errMsg(err) }); });
              } catch (err) { postMessage({ t: 'err', m: errMsg(err) }); }
            } else if (d.t === 'hands') {
              NH = d.n;
              if (lm) create(del).catch(function (err) { postMessage({ t: 'err', m: errMsg(err) }); });
            } else if (d.t === 'frame') {
              var t0 = performance.now();
              try {
                var r = lm.detectForVideo(d.bmp, d.ts);
                d.bmp.close();
                var hs = (r.landmarks && r.landmarks.length) ? r.landmarks.map(function (h) { return h.map(function (p) { return [p.x, p.y]; }); }) : null;
                postMessage({ t: 'res', pts: hs, ms: performance.now() - t0 });
              } catch (err) {
                try { d.bmp.close(); } catch (e2) {}
                if (del === 'GPU') {
                  create('CPU').then(function () { postMessage({ t: 'del', d: 'CPU' }); postMessage({ t: 'res', pts: null, ms: 0 }); })
                    .catch(function (e3) { postMessage({ t: 'err', m: errMsg(e3) }); });
                } else { postMessage({ t: 'err', m: errMsg(err) }); }
              }
            }
          };
          EOF
