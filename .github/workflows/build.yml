              var cand = [0, 70, -70, 140, -140];
              for (var i = 0; i < cand.length; i++) {
                var c = HUB.az + cand[i];
                if (WINS.every(function (w) { return Math.abs(angd(c, w.az)) > 35; })) { W.az = c; break; }
              }
              W.dom = mk('wf', '<div class="wh"><div class="wt"><span>' + a[0] + '</span><span>' + a[1] + '</span></div><div class="gbs">' +
