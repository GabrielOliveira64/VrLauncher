              ['💬', 'WhatsApp', '#15803d', '#14532d'], ['👽', 'Reddit', '#c2410c', '#7c2d12'],
              ['🗺️', 'Mapas', '#0f766e', '#134e4a'], ['📰', 'Notícias', '#be185d', '#831843']
