              String js = "(function(t){var e=document.activeElement;for(var i=0;i<4&&e&&e.tagName==='IFRAME';i++){try{var a=e.contentDocument.activeElement;if(!a)break;e=a}catch(x){break}}if(!e)return;var ok=false;try{ok=e.ownerDocument.execCommand('insertText',false,t)}catch(x){}if(!ok&&typeof e.value==='string'){var s=e.selectionStart,n=e.selectionEnd,v=e.value,nv=v.slice(0,s)+t+v.slice(n);var d=Object.getOwnPropertyDescriptor(Object.getPrototypeOf(e),'value');if(d&&d.set)d.set.call(e,nv);else e.value=nv;e.selectionStart=e.selectionEnd=s+t.length;e.dispatchEvent(new Event('input',{bubbles:true}))}})(" + JSONObject.quote(t) + ")";
