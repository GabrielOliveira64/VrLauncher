            }
            function openWin(idx) {
              var ex = WINS.filter(function (w) { return w.idx === idx; })[0];
              if (ex) { focusWin(ex); return; }
              if (WINS.length >= 3) { toast('Máximo de 3 janelas abertas'); return; }
              var a = WAPPS[idx];
