            HandLandmarker buildLm(boolean gpu) {
              HandLandmarker.HandLandmarkerOptions o = HandLandmarker.HandLandmarkerOptions.builder()
                .setBaseOptions(BaseOptions.builder().setModelAssetPath("mediapipe/hand_landmarker.task").setDelegate(gpu ? Delegate.GPU : Delegate.CPU).build())
                .setRunningMode(RunningMode.VIDEO)
                .setNumHands(numHands)
                .build();
              return HandLandmarker.createFromOptions(this, o);
            }
            void closeLm() {
              HandLandmarker l = lm; lm = null;
              if (l != null) { try { l.close(); } catch (Throwable t) { } }
            }
            void createLm() {
              closeLm();
              try { lm = buildLm(useGpu); lmErr = ""; }
              catch (Throwable t) {
                if (useGpu) {
                  useGpu = false;
                  try { lm = buildLm(false); lmErr = ""; } catch (Throwable t2) { lmErr = String.valueOf(t2.getMessage()); }
                } else lmErr = String.valueOf(t.getMessage());
              }
            }
            void analyze(ImageProxy img) {
              try {
                camOk = true;
                long now = SystemClock.elapsedRealtime();
                boolean idle = now - lastHandMs > 1500;
                long gap = idle ? 600 : (thermal >= 2 ? 66 : 0);
                if (gap > 0 && now - lastDetMs < gap) return;
                if (needLm) { needLm = false; createLm(); }
                HandLandmarker l = lm;
                if (l == null) return;
                Bitmap bmp = img.toBitmap();
                int rd = img.getImageInfo().getRotationDegrees();
                if (rd != 0) {
                  Matrix mx = new Matrix(); mx.postRotate(rd);
                  Bitmap r = Bitmap.createBitmap(bmp, 0, 0, bmp.getWidth(), bmp.getHeight(), mx, false);
                  bmp.recycle(); bmp = r;
                }
                int iw = bmp.getWidth(), ih = bmp.getHeight();
                long ts = img.getImageInfo().getTimestamp() / 1000000L;
                if (ts <= lastTs) ts = lastTs + 1;
                lastTs = ts;
                long t0 = SystemClock.elapsedRealtime();
                HandLandmarkerResult res = l.detectForVideo(new BitmapImageBuilder(bmp).build(), ts);
                long t1 = SystemClock.elapsedRealtime();
                float dtm = (float) Math.max(1L, t1 - lastDetMs);
                fpsAvg = fpsAvg == 0f ? 1000f / dtm : fpsAvg * 0.85f + (1000f / dtm) * 0.15f;
                msAvg = msAvg == 0f ? (t1 - t0) : msAvg * 0.85f + (t1 - t0) * 0.15f;
                lastDetMs = t1;
                StringBuilder sb = new StringBuilder();
                sb.append(iw).append(',').append(ih).append('|');
                List<List<NormalizedLandmark>> hs = res.landmarks();
                if (hs != null && !hs.isEmpty()) {
                  lastHandMs = t1;
                  for (int i = 0; i < hs.size(); i++) {
                    if (i > 0) sb.append(';');
                    List<NormalizedLandmark> pts = hs.get(i);
                    for (int j = 0; j < pts.size(); j++) {
                      if (j > 0) sb.append(',');
                      sb.append(Math.round(pts.get(j).x() * 10000f)).append(',').append(Math.round(pts.get(j).y() * 10000f));
                    }
                  }
                }
                handBox.set(sb.toString());
              } catch (Throwable t) {
                lmErr = String.valueOf(t.getMessage());
                if (useGpu) { useGpu = false; needLm = true; }
              } finally {
                img.close();
              }
            }
            void startCamera() {
              if (camStarted) return;
              camStarted = true;
              camExec.execute(this::createLm);
              final ListenableFuture<ProcessCameraProvider> f = ProcessCameraProvider.getInstance(this);
              f.addListener(() -> {
                try {
                  ProcessCameraProvider cp = f.get();
                  ResolutionSelector rsP = new ResolutionSelector.Builder()
                    .setAspectRatioStrategy(AspectRatioStrategy.RATIO_16_9_FALLBACK_AUTO_STRATEGY)
                    .setResolutionStrategy(new ResolutionStrategy(new Size(960, 540), ResolutionStrategy.FALLBACK_RULE_CLOSEST_HIGHER_THEN_LOWER))
                    .build();
                  ResolutionSelector rsA = new ResolutionSelector.Builder()
                    .setAspectRatioStrategy(AspectRatioStrategy.RATIO_16_9_FALLBACK_AUTO_STRATEGY)
                    .setResolutionStrategy(new ResolutionStrategy(new Size(640, 360), ResolutionStrategy.FALLBACK_RULE_CLOSEST_HIGHER_THEN_LOWER))
                    .build();
                  preview = new Preview.Builder().setResolutionSelector(rsP).build();
                  preview.setSurfaceProvider(previewView.getSurfaceProvider());
                  analysis = new ImageAnalysis.Builder()
                    .setResolutionSelector(rsA)
                    .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                    .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888)
                    .build();
                  analysis.setAnalyzer(camExec, this::analyze);
                  cp.unbindAll();
                  cp.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview, analysis);
                } catch (Throwable t) { camErr = "camera: " + t.getMessage(); }
              }, ContextCompat.getMainExecutor(this));
            }

