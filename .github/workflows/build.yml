              if (rot == null) rot = sm.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR);
              lin = sm.getDefaultSensor(Sensor.TYPE_LINEAR_ACCELERATION);
              if (lin == null) lin = sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
            }
            void openWin(int id, int idx) {
              if (idx < 0 || idx >= URLS.length || find(id) != null) return;
              final Win w = new Win(); w.id = id;
              WebView v = new WebView(this); w.v = v;
              v.setBackgroundColor(Color.BLACK);
              WebSettings s = v.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              if (DESK[idx]) {
                s.setUserAgentString(UA_DESK);
                s.setUseWideViewPort(true);
                s.setLoadWithOverviewMode(true);
              }
              CookieManager.getInstance().setAcceptThirdPartyCookies(v, true);
              v.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest r) {
                  String u = r.getUrl().toString();
                  return !(u.startsWith("http:") || u.startsWith("https:") || u.startsWith("about:") || u.startsWith("blob:") || u.startsWith("data:"));
                }
                @Override public void onReceivedError(WebView view, WebResourceRequest r, WebResourceError e) {
                  if (r.isForMainFrame()) {
                    view.loadData("<body style='margin:0;background:#111;color:#fff;font:28px sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center'><div>Sem conexão<br><small>" + e.getDescription() + "</small></div></body>", "text/html; charset=utf-8", "UTF-8");
                  }
                }
              });
              v.setOutlineProvider(new ViewOutlineProvider() {
                @Override public void getOutline(View vw, Outline o) { o.setRoundRect(0, 0, vw.getWidth(), vw.getHeight(), 36f); }
              });
              v.setClipToOutline(true);
              v.setPivotX(0f); v.setPivotY(0f);
              v.setTranslationX(-5000f);
              root.addView(v, root.indexOfChild(curv), new FrameLayout.LayoutParams(w.pw, w.ph));
              wins.add(w);
              v.loadUrl(URLS[idx]);
            }
            void closeWin(int id) {
              Win w = find(id);
              if (w == null) return;
              if (down == w) down = null;
              wins.remove(w);
              root.removeView(w.v);
              w.v.stopLoading();
              w.v.destroy();
            }
            void frontWin(int id) {
              Win w = find(id);
              if (w == null) return;
              wins.remove(w); wins.add(w);
              w.v.bringToFront(); curv.bringToFront();
            }
            void applyRects(String s) {
              for (String part : s.split(";")) {
                String[] a = part.split(",");
                if (a.length < 7) continue;
                try {
                  Win w = find(Integer.parseInt(a[0]));
                  if (w == null) continue;
                  w.x = Float.parseFloat(a[1]) * density; w.y = Float.parseFloat(a[2]) * density;
                  w.w = Float.parseFloat(a[3]) * density; w.h = Float.parseFloat(a[4]) * density;
                  int pw = Integer.parseInt(a[5]), ph = Integer.parseInt(a[6]);
                  if (pw != w.pw || ph != w.ph) { w.pw = pw; w.ph = ph; w.v.setLayoutParams(new FrameLayout.LayoutParams(pw, ph)); }
                  if (w.w > 1f) {
                    w.v.setTranslationX(w.x); w.v.setTranslationY(w.y);
                    w.v.setScaleX(w.w / w.pw); w.v.setScaleY(w.h / w.ph);
                    w.v.setVisibility(View.VISIBLE);
                  } else {
                    w.v.setVisibility(View.INVISIBLE);
                  }
                } catch (Exception e) { }
              }
            }
            void send(Win w, int action, float cx, float cy) {
              if (w.w < 1f) return;
              float px = clamp((cx - w.x) / w.w * w.pw, 0f, w.pw - 1f);
              float py = clamp((cy - w.y) / w.h * w.ph, 0f, w.ph - 1f);
              long now = SystemClock.uptimeMillis();
              if (action == MotionEvent.ACTION_DOWN) downTime = now;
              MotionEvent e = MotionEvent.obtain(downTime, now, action, px, py, 0);
              e.setSource(InputDevice.SOURCE_TOUCHSCREEN);
              w.v.dispatchTouchEvent(e);
              e.recycle();
            }
            void onCursor(float x, float y, boolean pinch, boolean has) {
              float cx = x * density, cy = y * density;
              Win hit = null;
              if (has) {
                for (int i = wins.size() - 1; i >= 0; i--) {
                  Win w = wins.get(i);
                  if (w.w > 1f && w.v.getVisibility() == View.VISIBLE && cx >= w.x && cx <= w.x + w.w && cy >= w.y && cy <= w.y + w.h) { hit = w; break; }
                }
              }
              curv.x = cx; curv.y = cy; curv.pinch = pinch;
              curv.show = has && (hit != null || down != null);
              curv.postInvalidate();
              if (down != null) {
                if (pinch && has) { lastX = cx; lastY = cy; send(down, MotionEvent.ACTION_MOVE, cx, cy); }
                else { Win w = down; down = null; send(w, MotionEvent.ACTION_UP, lastX, lastY); }
              } else {
                if (!pinch || !has) armed = true;
                if (pinch && has && armed && hit != null) {
                  down = hit; lastX = cx; lastY = cy;
                  frontWin(hit.id);
                  send(hit, MotionEvent.ACTION_DOWN, cx, cy);
                }
              }
            }
            @Override public void onRequestPermissionsResult(int c, String[] p, int[] res) {
              if (pending != null) {
                if (res.length > 0 && res[0] == PackageManager.PERMISSION_GRANTED) pending.grant(pending.getResources());
                else pending.deny();
                pending = null;
              }
            }
            @Override public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) web.setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
            }
            @Override protected void onResume() {
              super.onResume();
              if (rot != null) sm.registerListener(this, rot, SensorManager.SENSOR_DELAY_GAME);
              if (lin != null) sm.registerListener(this, lin, SensorManager.SENSOR_DELAY_GAME);
            }
            @Override protected void onPause() { super.onPause(); sm.unregisterListener(this); }
            @Override protected void onDestroy() {
              for (Win w : new ArrayList<>(wins)) closeWin(w.id);
              super.onDestroy();
            }
            @Override public void onSensorChanged(SensorEvent e) {
              int ty = e.sensor.getType();
              if (ty == Sensor.TYPE_LINEAR_ACCELERATION || ty == Sensor.TYPE_ACCELEROMETER) {
                float x = e.values[0], y = e.values[1], z = e.values[2];
                if (ty == Sensor.TYPE_ACCELEROMETER) {
                  grav[0] = 0.95f * grav[0] + 0.05f * x;
                  grav[1] = 0.95f * grav[1] + 0.05f * y;
                  grav[2] = 0.95f * grav[2] + 0.05f * z;
                  x -= grav[0]; y -= grav[1]; z -= grav[2];
                }
                lx = x; ly = y; lz = z;
                return;
              }
              if (!ready) return;
              SensorManager.getRotationMatrixFromVector(m, e.values);
              StringBuilder sb = new StringBuilder("__r([");
              for (int i = 0; i < 9; i++) { sb.append(m[i]); if (i < 8) sb.append(','); }
              sb.append("],").append(lx).append(',').append(ly).append(',').append(lz).append(')');
              web.evaluateJavascript(sb.toString(), null);
            }
            @Override public void onAccuracyChanged(Sensor s, int a) { }
          }
