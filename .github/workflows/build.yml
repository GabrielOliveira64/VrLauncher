          package com.vr.launcher;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.view.View;

          /** Camada 2D por cima do GL: esqueleto da mao, cursor e informacoes de depuracao. */
          final class ArOverlay extends View {

            static final class Snap {
              float[] skel;          // 42 floats em pixels da tela, ou null
              float cx, cy;
              boolean hasCursor, pinched;
              int region;            // 0 nada, 1 corpo, 2 barra, 3 canto
              float progress;        // punho segurado para fechar a janela: 0..1
              boolean fist;
              String[] lines;
            }

            private static final int[][] CONN = {
              {0, 1}, {1, 2}, {2, 3}, {3, 4}, {0, 5}, {5, 6}, {6, 7}, {7, 8}, {5, 9}, {9, 10}, {10, 11}, {11, 12},
              {9, 13}, {13, 14}, {14, 15}, {15, 16}, {13, 17}, {17, 18}, {18, 19}, {19, 20}, {0, 17}
            };

            private volatile Snap snap;
            private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
            private final float d;
            private final RectF oval = new RectF(0f, 0f, 0f, 0f);

            ArOverlay(Context c) {
              super(c);
              setWillNotDraw(false);
              setClickable(false);
              d = c.getResources().getDisplayMetrics().density;
            }

            void update(Snap s) {
              snap = s;
              postInvalidate();
            }

            @Override protected void onDraw(Canvas canvas) {
              Snap s = snap;
              if (s == null) return;

              float[] k = s.skel;
              if (k != null) {
                paint.setStyle(Paint.Style.STROKE);
                paint.setStrokeWidth(2f * d);
                paint.setColor(Color.argb(100, 255, 255, 255));
                for (int[] c : CONN) canvas.drawLine(k[2 * c[0]], k[2 * c[0] + 1], k[2 * c[1]], k[2 * c[1] + 1], paint);
                paint.setStyle(Paint.Style.FILL);
                paint.setColor(Color.argb(150, 255, 255, 255));
                for (int i = 0; i < 21; i++) canvas.drawCircle(k[2 * i], k[2 * i + 1], 2.5f * d, paint);
              }

              if (s.hasCursor) {
                int col = Color.WHITE;
                if (s.pinched) col = Color.rgb(94, 234, 212);
                else if (s.region == 2) col = Color.rgb(255, 214, 0);
                else if (s.region == 3) col = Color.rgb(0, 230, 118);
                paint.setStyle(Paint.Style.STROKE);
                paint.setStrokeWidth(3f * d);
                paint.setColor(col);
                canvas.drawCircle(s.cx, s.cy, (s.pinched ? 10f : 16f) * d, paint);
                paint.setStyle(Paint.Style.FILL);
                canvas.drawCircle(s.cx, s.cy, 4f * d, paint);
              }

              if (s.hasCursor && s.fist) {
                float r = 26f * d;
                oval.set(s.cx - r, s.cy - r, s.cx + r, s.cy + r);
                paint.setStyle(Paint.Style.STROKE);
                paint.setStrokeWidth(5f * d);
                paint.setColor(Color.argb(90, 255, 82, 82));
                canvas.drawCircle(s.cx, s.cy, r, paint);
                if (s.progress > 0f) {
                  paint.setColor(Color.rgb(255, 82, 82));
                  canvas.drawArc(oval, -90f, 360f * Math.min(1f, s.progress), false, paint);
                }
              }

              String[] ln = s.lines;
              if (ln != null) {
                paint.setStyle(Paint.Style.FILL);
                paint.setColor(Color.WHITE);
                paint.setTextSize(12f * d);
                paint.setShadowLayer(3f * d, 0f, 0f, Color.BLACK);
                float y = 20f * d;
                for (String t : ln) {
                  if (t == null || t.length() == 0) continue;
                  canvas.drawText(t, 10f * d, y, paint);
                  y += 16f * d;
                }
                paint.clearShadowLayer();
              }
            }
          }
