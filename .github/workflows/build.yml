            final java.util.concurrent.ExecutorService camExec = java.util.concurrent.Executors.newSingleThreadExecutor();
            final java.util.concurrent.atomic.AtomicReference<String> handBox = new java.util.concurrent.atomic.AtomicReference<>(null);
            volatile HandLandmarker lm = null;
            volatile boolean useGpu = true, needLm = true, camOk = false;
            volatile int numHands = 1, thermal = 0;
            volatile String lmErr = "", camErr = "";
            volatile long lastHandMs = 0, lastDetMs = 0;
