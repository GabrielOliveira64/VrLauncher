          cat > app/src/main/assets/lean.js <<'EOF'
          (function () {
            var UI = window.UI, WS = UI.WS;
            WS.L = 0;
            var G = 1400, SIGN = 1;
            try { if (localStorage.getItem('vrsign') === '-1') SIGN = -1; } catch (e) {}
            var on = true, v = 0, p = 0, t0 = 0, calm = 0, w = 0, fp = null, sm = 0, lastHud = 0, fa = 0, bias = 0;

            var bar = document.getElementById('ui');
            bar.style.flexWrap = 'wrap';
            var tb = document.createElement('button'); tb.textContent = '↕ Inclinar: sim';
            var ib = document.createElement('button'); ib.textContent = '⇅ Inverter';
            var lv = document.createElement('span'); lv.textContent = '↕ 0 cm';
            bar.insertBefore(lv, bar.firstChild); bar.insertBefore(ib, bar.firstChild); bar.insertBefore(tb, bar.firstChild);

            function reset() { v = 0; p = 0; calm = 0; fa = 0; }
            tb.onclick = function () {
              on = !on;
              tb.textContent = on ? '↕ Inclinar: sim' : '↕ Inclinar: não';
              if (!on) reset();
            };
            ib.onclick = function () {
              SIGN = -SIGN; bias = 0; reset();
              try { localStorage.setItem('vrsign', String(SIGN)); } catch (e) {}
            };
            var rcb = document.getElementById('rc'), prev = rcb.onclick;
            rcb.onclick = function () { if (prev) prev(); reset(); };

            window.__a = function (x, y, z) {
              var now = performance.now(), dt = (now - t0) / 1000; t0 = now;
              if (dt <= 0.002 || dt > 0.1) { fp = null; return; }
              var f = [-Rdev[2], -Rdev[5], -Rdev[8]];
              if (fp) {
                var cx = f[1] * fp[2] - f[2] * fp[1], cy = f[2] * fp[0] - f[0] * fp[2], cz = f[0] * fp[1] - f[1] * fp[0];
                w = w * 0.7 + (Math.sqrt(cx * cx + cy * cy + cz * cz) / dt) * 0.3;
              }
              fp = f;
              if (!on) return;
              var raw = SIGN * z;
              fa = fa * 0.6 + (raw - bias) * 0.4;
              var a = fa, still = false;
              if (w > 0.9) { a = 0; v = 0; calm = 0; }
              else if (Math.abs(a) < 0.15) {
                a = 0; calm += dt;
                if (calm > 0.2) { v = 0; still = true; }
              } else calm = 0;
              if (still && w < 0.3) bias += (raw - bias) * 0.02;
              v += a * dt; v *= Math.exp(-dt / 1.2);
              p += v * dt; p *= Math.exp(-dt / (still ? 1.5 : 5));
              p = Math.max(-0.35, Math.min(0.35, p));
            };

            function frame() {
              requestAnimationFrame(frame);
              var pd = Math.abs(p) < 0.02 ? 0 : p - (p > 0 ? 0.02 : -0.02);
              var target = on ? pd * G : 0;
              sm += (target - sm) * 0.25;
              if (Math.abs(sm - WS.L) > 0.4) { WS.L = sm; UI.layout(); }
              var n = performance.now();
              if (n - lastHud > 250) {
                lastHud = n;
                lv.textContent = '↕ ' + (pd * 100).toFixed(0) + ' cm · rot ' + w.toFixed(1);
              }
            }
            requestAnimationFrame(frame);
          })();
