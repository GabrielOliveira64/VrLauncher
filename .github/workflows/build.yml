              toggle: function (W) { if (K.open && K.tw === W) closeKb(); else openKb(W); }
            };

            function toLocal(x, y) {
              var k = K.scr.S * K.s, rr = -K.scr.roll * D, c = Math.cos(rr), s = Math.sin(rr), dx = x - K.scr.x, dy = y - K.scr.y;
