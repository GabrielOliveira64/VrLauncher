          package com.vr.launcher;

          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;

          /**
           * Barra do navegador acima de cada janela (abas, voltar, avancar, endereco, fechar).
           * Desenhada num bitmap 960x182 que vira textura; o desenho usa unidades de 720x136.
           */
          final class ArChrome {

            static final int DW = 720, DH = 136;
            static final int BW = 960, BH = 182;
            static final float K = BW / (float) DW;

            static final int NONE = 0, TAB = 1, TABX = 2, NEW = 3, WINX = 4, BACK = 5, FWD = 6, URL = 7;

            // linha das abas e linha de navegacao (unidades de projeto)
            private static final float R1_T = 4f, R1_B = 56f, R2_T = 62f, R2_B = 132f;
            private static final float NEW_X0 = 660f, NEW_X1 = 714f;
            private static final float TABS_X0 = 6f, TABS_X1 = 654f, GAP = 4f, TAB_MAX = 200f;
            private static final float BACK_X0 = 6f, BACK_X1 = 76f, FWD_X0 = 80f, FWD_X1 = 150f;
            private static final float URL_X0 = 154f, URL_X1 = 640f, WINX_X0 = 644f, WINX_X1 = 714f;
            private static final float PAD = 3f;

            private static final Paint P = new Paint(Paint.ANTI_ALIAS_FLAG);
            private static final RectF R = new RectF(0f, 0f, 0f, 0f);
            private static final Path PATH = new Path();

            private ArChrome() { }

            static float tabW(int n) {
              float w = (TABS_X1 - TABS_X0 - (n - 1) * GAP) / Math.max(1, n);
              return Math.min(TAB_MAX, w);
            }

            static float tabX0(int i, int n) { return TABS_X0 + i * (tabW(n) + GAP); }

            /** Retangulo (x0,y0,x1,y1) em unidades de projeto de um elemento. */
            static void rect(int elem, int idx, int n, float[] out) {
              float x0 = 0f, x1 = 0f, y0 = R1_T, y1 = R1_B;
              switch (elem) {
                case TAB: x0 = tabX0(idx, n); x1 = x0 + tabW(n); break;
                case TABX: x1 = tabX0(idx, n) + tabW(n) - 3f; x0 = x1 - 44f; y0 = R1_T + 3f; y1 = R1_B - 3f; break;
                case NEW: x0 = NEW_X0; x1 = NEW_X1; break;
                case BACK: x0 = BACK_X0; x1 = BACK_X1; y0 = R2_T; y1 = R2_B; break;
                case FWD: x0 = FWD_X0; x1 = FWD_X1; y0 = R2_T; y1 = R2_B; break;
                case URL: x0 = URL_X0; x1 = URL_X1; y0 = R2_T; y1 = R2_B; break;
                case WINX: x0 = WINX_X0; x1 = WINX_X1; y0 = R2_T; y1 = R2_B; break;
                default: break;
              }
              out[0] = x0; out[1] = y0; out[2] = x1; out[3] = y1;
            }

            /** dx, dy em unidades de projeto (0,0 = canto superior esquerdo). Devolve elem | (indice << 8). */
            static int hit(float dx, float dy, int n, int cur) {
              if (dx < 0f || dx > DW || dy < 0f || dy > DH) return NONE;
              float[] r = new float[4];
              if (dy <= (R1_B + R2_T) / 2f) {
                rect(NEW, 0, n, r);
                if (in(dx, dy, r)) return NEW;
                if (cur >= 0 && cur < n) {
                  rect(TABX, cur, n, r);
                  if (in(dx, dy, r)) return TABX | (cur << 8);
                }
                for (int i = 0; i < n; i++) {
                  rect(TAB, i, n, r);
                  if (in(dx, dy, r)) return TAB | (i << 8);
                }
                return NONE;
              }
              rect(BACK, 0, n, r);
              if (in(dx, dy, r)) return BACK;
              rect(FWD, 0, n, r);
              if (in(dx, dy, r)) return FWD;
              rect(WINX, 0, n, r);
              if (in(dx, dy, r)) return WINX;
              rect(URL, 0, n, r);
              if (in(dx, dy, r)) return URL;
              return NONE;
            }

            private static boolean in(float x, float y, float[] r) {
              return x >= r[0] - PAD && x <= r[2] + PAD && y >= r[1] - PAD && y <= r[3] + PAD;
            }

            // =============================================================
            // Desenho
            // =============================================================

            static void draw(Bitmap bmp, ArPanel.Snap s) {
              Canvas c = new Canvas(bmp);
              bmp.eraseColor(0);
              c.scale(K, K);
              float[] r = new float[4];

              // fundo
              fill(c, 0f, 0f, DW, DH, 18f, Color.argb(235, 24, 27, 38));

              int n = s.n;
              for (int i = 0; i < n; i++) {
                rect(TAB, i, n, r);
                boolean sel = i == s.cur;
                fill(c, r[0], r[1], r[2], r[3], 12f, sel ? Color.rgb(62, 70, 96) : Color.rgb(40, 45, 62));
                if (sel) fill(c, r[0] + 12f, r[3] - 5f, r[2] - 12f, r[3] - 1f, 2f, Color.rgb(94, 234, 212));
                float textR = r[2] - (sel ? 52f : 10f);
                text(c, s.titles[i], r[0] + 12f, 36f, textR - (r[0] + 12f), 22f, sel ? Color.WHITE : Color.rgb(170, 176, 196));
                if (sel) {
                  rect(TABX, i, n, r);
                  cross(c, (r[0] + r[2]) / 2f, (r[1] + r[3]) / 2f, 8f, Color.rgb(220, 224, 236), 4f);
                }
              }
              if (n < ArPanel.MAXT) {
                rect(NEW, 0, n, r);
                fill(c, r[0], r[1], r[2], r[3], 12f, Color.rgb(40, 45, 62));
                float cx = (r[0] + r[2]) / 2f, cy = (r[1] + r[3]) / 2f;
                line(c, cx - 10f, cy, cx + 10f, cy, Color.rgb(94, 234, 212), 4f);
                line(c, cx, cy - 10f, cx, cy + 10f, Color.rgb(94, 234, 212), 4f);
              }

              rect(BACK, 0, n, r);
              fill(c, r[0], r[1], r[2], r[3], 14f, Color.rgb(40, 45, 62));
              arrow(c, (r[0] + r[2]) / 2f, (r[1] + r[3]) / 2f, -1f, s.back ? Color.WHITE : Color.argb(90, 255, 255, 255));
              rect(FWD, 0, n, r);
              fill(c, r[0], r[1], r[2], r[3], 14f, Color.rgb(40, 45, 62));
              arrow(c, (r[0] + r[2]) / 2f, (r[1] + r[3]) / 2f, 1f, s.fwd ? Color.WHITE : Color.argb(90, 255, 255, 255));

              rect(URL, 0, n, r);
              fill(c, r[0], r[1], r[2], r[3], 14f, Color.rgb(32, 36, 50));
              text(c, shortUrl(s.url), r[0] + 18f, (r[1] + r[3]) / 2f + 8f, r[2] - r[0] - 36f, 24f, Color.rgb(205, 210, 226));

              rect(WINX, 0, n, r);
              fill(c, r[0], r[1], r[2], r[3], 14f, Color.rgb(150, 52, 60));
              cross(c, (r[0] + r[2]) / 2f, (r[1] + r[3]) / 2f, 11f, Color.WHITE, 5f);
            }

            static String shortUrl(String u) {
              if (u == null) return "";
              String t = u;
              if (t.startsWith("https://")) t = t.substring(8);
              else if (t.startsWith("http://")) t = t.substring(7);
              if (t.startsWith("www.")) t = t.substring(4);
              if (t.endsWith("/")) t = t.substring(0, t.length() - 1);
              return t;
            }

            private static void fill(Canvas c, float x0, float y0, float x1, float y1, float rad, int col) {
              P.setStyle(Paint.Style.FILL);
              P.setColor(col);
              R.set(x0, y0, x1, y1);
              c.drawRoundRect(R, rad, rad, P);
            }

            private static void line(Canvas c, float x0, float y0, float x1, float y1, int col, float w) {
              P.setStyle(Paint.Style.STROKE);
              P.setStrokeWidth(w);
              P.setStrokeCap(Paint.Cap.ROUND);
              P.setColor(col);
              c.drawLine(x0, y0, x1, y1, P);
            }

            private static void cross(Canvas c, float cx, float cy, float h, int col, float w) {
              line(c, cx - h, cy - h, cx + h, cy + h, col, w);
              line(c, cx - h, cy + h, cx + h, cy - h, col, w);
            }

            /** dir = -1 seta para a esquerda, +1 para a direita. */
            private static void arrow(Canvas c, float cx, float cy, float dir, int col) {
              P.setStyle(Paint.Style.STROKE);
              P.setStrokeWidth(6f);
              P.setStrokeCap(Paint.Cap.ROUND);
              P.setColor(col);
              PATH.reset();
              PATH.moveTo(cx - dir * 4f, cy - 15f);
              PATH.lineTo(cx + dir * 10f, cy);
              PATH.lineTo(cx - dir * 4f, cy + 15f);
              c.drawPath(PATH, P);
              c.drawLine(cx + dir * 10f, cy, cx - dir * 14f, cy, P);
            }

            private static void text(Canvas c, String t, float x, float baseY, float maxW, float size, int col) {
              if (t == null) t = "";
              P.setStyle(Paint.Style.FILL);
              P.setColor(col);
              P.setTextSize(size);
              if (maxW < 8f) return;
              int cnt = P.breakText(t, true, maxW, null);
              String out = t;
              if (cnt < t.length()) out = t.substring(0, Math.max(0, cnt - 1)) + "…";
              c.drawText(out, x, baseY, P);
            }
          }
