                  parts.push([W.id, ok ? r.left.toFixed(1) : 0, ok ? r.top.toFixed(1) : 0, ok ? r.width.toFixed(1) : 0, ok ? r.height.toFixed(1) : 0, W.ar ? 1120 : 960, W.ar ? 480 : 540].join(','));
                });
