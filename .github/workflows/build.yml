name: Build APK
on:
  push:
    paths-ignore:
      - 'loja/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Baixar modelo de mao
        run: |
          mkdir -p app/src/main/assets/mediapipe
          curl -fL -o app/src/main/assets/mediapipe/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
      - name: Projeto Gradle
        run: |
          mkdir -p app/src/main/java/com/vr/launcher app/src/main/assets
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VRLauncher"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          def ksf = rootProject.file('release.jks')
          def kpf = rootProject.file('keystore.properties')
          android {
            namespace 'com.vr.launcher'
            compileSdk 34
            defaultConfig {
              applicationId 'com.vr.launcher'
              minSdk 24
              targetSdk 34
              versionCode 100 + (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
              versionName '4.0'
              ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            }
            if (ksf.exists() && kpf.exists()) {
              def kp = new Properties()
              kpf.withInputStream { kp.load(it) }
              signingConfigs {
                fixed {
                  storeFile ksf
                  storePassword kp['pass']
                  keyAlias 'vr'
                  keyPassword kp['pass']
                }
              }
              buildTypes {
                debug { signingConfig signingConfigs.fixed }
              }
            }
          }
          dependencies {
            implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
            implementation 'androidx.activity:activity:1.8.2'
            implementation 'androidx.camera:camera-core:1.3.4'
            implementation 'androidx.camera:camera-camera2:1.3.4'
            implementation 'androidx.camera:camera-lifecycle:1.3.4'
            implementation 'androidx.camera:camera-view:1.3.4'
            implementation 'com.google.mediapipe:tasks-vision:0.10.14'
            implementation 'com.google.guava:guava:32.1.3-android'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-feature android:name="android.hardware.camera" android:required="false"/>
            <application android:largeHeap="true" android:label="VR Launcher" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true"
                android:screenOrientation="sensorLandscape"
                android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
      - name: Pagina base
        run: |
          cp "$(ls *.html | head -1)" app/src/main/assets/index.html
          sed -i 's#</body>#<script src="ar.js"></script><script src="ui.js"></script><script src="hand.js"></script><script src="fix.js"></script><script src="spatial.js"></script><script src="boot.js"></script></body>#' app/src/main/assets/index.html
          cat > app/src/main/assets/ar.js <<'EOF'
          (function () {
            var css = document.createElement('style');
            css.textContent = 'html,body,#view{background:transparent!important}.star{display:none}';
            document.head.appendChild(css);
          })();
          EOF
          cat > app/src/main/assets/fix.js <<'EOF'
          (function () {
            var L = 20, K = 0.40;
            var buf = [], orig = null, Lx = null;
            window.__lag = function (v) { Lx = v; };
            function wrap(a, x, y, z) {
              var now = performance.now();
              if (orig) orig(a, x, y, z);
              buf.push([now, a]);
              while (buf.length > 1 && buf[1][0] <= now - (Lx != null ? Lx : L)) buf.shift();
              Rdev = buf[0][1];
            }
            Object.defineProperty(window, '__r', { configurable: true, get: function () { return wrap; }, set: function (f) { orig = f; } });
            function applyK() { P = innerWidth * K; view.style.perspective = P + 'px'; }
            addEventListener('resize', applyK);
            applyK();
          })();
          EOF
      - name: Interface (ui.js)
        run: |
          cat > app/src/main/assets/ui.js <<'EOF'
          (function () {
            var A = window.Android || null, lastF = -1;
            function nOpen(i, k) { if (A) A.open(i, k); }
            function nClose(i) { if (A) A.close(i); }
            function nFront(i) { if (A) A.front(i); }
            function nRects(s) { if (A) A.rects(s); }
            function nCur(x, y, p, h) { if (A) A.cursor(x, y, p, h); }
            function nFist(p) { if (p === lastF) return; lastF = p; if (A) A.fist(p); }
            function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
            function angd(a, b) { var d = (((a - b) % 360) + 360) % 360; return d > 180 ? d - 360 : d; }
            function hwd(w, s, R) { return Math.atan(w * s / 2 / R) / D; }
            function rn(o) { return clamp(o.R, 240, 2400); }

            var css = document.createElement('style');
            css.textContent = [
              '#wl>div{position:absolute;left:0;top:0;will-change:transform;color:#fff;font-family:system-ui,-apple-system,sans-serif}',
              '.hub{width:360px;height:640px;margin:-320px 0 0 -180px;padding:22px;border-radius:44px;background:rgba(14,16,22,.78);border:1px solid rgba(255,255,255,.16);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);grid-auto-flow:column;gap:14px}',
              '.mi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:30px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:19px;font-weight:300;letter-spacing:.5px;transition:background .12s,color .12s}',
              '.mi svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}',
              '.mi.on{background:rgba(255,255,255,.22)}',
              '.mi.hand,.ai.hand{background:#fff;color:#000}',
              '.tab{width:760px;height:340px;margin:-170px 0 0 -380px;padding:24px;border-radius:40px;background:rgba(14,16,22,.78);border:1px solid rgba(255,255,255,.16);display:none;flex-direction:column;gap:14px}',
              '.tt{font-size:20px;font-weight:300;letter-spacing:2px;opacity:.7;height:26px}',
              '.ag{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:12px}',
              '.ai{display:flex;align-items:center;gap:16px;padding:0 16px;border-radius:26px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:21px;transition:background .12s,color .12s}',
              '.lg{width:46px;height:46px;border-radius:14px;background:#fff;color:#000;font-weight:600;font-size:24px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}',
              '.lg img{width:30px;height:30px}',
              '.hg{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);grid-auto-flow:column;gap:4px 26px}',
              '.hi{display:flex;align-items:center;font-size:16px;font-weight:300;line-height:1.25;opacity:.92}',
              '.hi b{font-weight:600}',
              '.aw{width:720px;height:405px;margin:-202.5px 0 0 -360px}',
              '.aw.gst{outline:2px solid rgba(255,255,255,.3);outline-offset:-2px;border-radius:24px;background:rgba(255,255,255,.05)}',
              '.bar{position:absolute;left:50%;top:100%;width:280px;height:44px;margin:4px 0 0 -140px}',
              '.bar::after,.gbar::after{content:"";position:absolute;left:50%;top:50%;width:200px;height:8px;margin:-4px 0 0 -100px;border-radius:4px;background:#fff;opacity:.85;transition:width .15s,margin .15s,opacity .15s}',
              '.bar.hand::after,.gbar.hand::after{width:250px;margin-left:-125px;opacity:1}',
              '.gbar{width:280px;height:44px;margin:-22px 0 0 -140px}',
              '.grh{width:44px;height:44px;margin:-22px 0 0 -22px;border-right:5px solid rgba(255,255,255,.9);border-bottom:5px solid rgba(255,255,255,.9);border-bottom-right-radius:28px}',
              '.grh.hand{border-color:#fff;filter:drop-shadow(0 0 8px #fff)}',
              '.lk{width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(14,16,22,.6);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;color:#fff}',
              '.lk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}',
              '.lk.hand{background:#fff;color:#000}',
              '.rh{position:absolute;right:-10px;bottom:-10px;width:44px;height:44px;border-right:5px solid rgba(255,255,255,.9);border-bottom:5px solid rgba(255,255,255,.9);border-bottom-right-radius:28px;transition:transform .15s}',
              '.rh.hand{transform:scale(1.25);border-color:#fff}',
              '.bub{width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:rgba(40,46,60,.78);border:1px solid rgba(255,255,255,.3);display:none;align-items:center;justify-content:center}',
              '.bub .lg{width:56px;height:56px}',
              '.bub.hand{background:rgba(255,255,255,.4)}'
            ].join('');
            document.head.appendChild(css);

            var wl = document.createElement('div');
            wl.id = 'wl';
            wl.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;z-index:5;pointer-events:none;overflow:hidden';
            document.body.appendChild(wl);

            clock.remove(); win.remove(); closeBtn.remove();
            ring.forEach(function (r) { r.el.remove(); });
            ring.length = 0;
            items = [];
            setItems = function () { items = []; };
            scene.style.display = 'none';

            var NAMES = ['YouTube', 'Google', 'Wikipédia', 'Discord', 'WhatsApp', 'Reddit', 'Mapas', 'Notícias'];
            var DOM = ['youtube.com', 'google.com', 'wikipedia.org', 'discord.com', 'whatsapp.com', 'reddit.com', 'openstreetmap.org', 'news.google.com'];
            function logo(i) {
              var d = document.createElement('div'); d.className = 'lg';
              var im = new Image();
              im.onerror = function () { d.textContent = NAMES[i].charAt(0); im.remove(); };
              im.src = 'https://www.google.com/s2/favicons?domain=' + DOM[i] + '&sz=128';
              d.appendChild(im);
              return d;
            }
            var IC = {
              home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
              search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
              help: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2.9-1.2 1.8"/><path d="M12 17h.01"/>',
              space: '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="3.6" ry="9"/>',
              apps: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/>',
              cfg: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'
            };
            var CHAIN = '<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';

            var HUB = { az: 0, ev: 0, R: 1100, s: 1, hidden: true, off: 0 };
            var TAB = null, lastHide = 0;
            var WINS = [], GROUPS = [], nextId = 1, T_hub = [], T_apps = [], T_space = [], miApps = null, miHelp = null, miSpace = null;
            var bp = null, rs = null, mg = null, sw = null, lastPk = 0, swo = null, lastPo = 0, swr = null, lastRe = 0;
            var UI = window.UI = {
              T: [], WINS: WINS,
              showHub: function () { showHub(); }, hideHub: function () { hideHub(); },
              hubHidden: function () { return HUB.hidden; },
              rebuild: function () { rebuild(); },
              get T_space() { return T_space; }, get tabSpace() { return tabSpace; }
            };

            function mk2(cls, html) {
              var d = document.createElement('div');
              d.className = cls; if (html) d.innerHTML = html; wl.appendChild(d);
              return d;
            }
            function gDelta(G) { return 2 * Math.asin(Math.min(0.97, 720 * G.s * 1.012 / (2 * rn(G)))) / D; }
            function ent(W) { return W.grp || W; }
            function toast(t) {
              var d = document.createElement('div');
              d.style.cssText = 'position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:40;background:rgba(0,0,0,.75);color:#fff;font:13px system-ui;padding:7px 14px;border-radius:999px';
              d.textContent = t; document.body.appendChild(d);
              setTimeout(function () { d.remove(); }, 2200);
            }
            function soon() { toast('Em breve'); }

            var hubEl = mk2('hub', '');
            hubEl.style.display = 'none';
            hubEl.style.zIndex = 200;
            document.body.classList.add('vrh');
            var MENU = [
              ['home', 'Home', function () { closeTab(); }],
              ['search', 'Google', function () { openWin(1); }],
              ['help', 'Ajuda', function () { setTab('help'); }],
              ['space', 'Espacial', function () { setTab('space'); }],
              ['apps', 'Apps', function () { setTab('apps'); }],
              ['cfg', 'Configurações', soon]
            ];
            MENU.forEach(function (m) {
              var d = document.createElement('div'); d.className = 'mi';
              d.innerHTML = '<svg viewBox="0 0 24 24">' + IC[m[0]] + '</svg><span>' + m[1] + '</span>';
              hubEl.appendChild(d);
              T_hub.push({ k: 'btn', el: d, fn: m[2] });
              if (m[0] === 'apps') miApps = d;
              if (m[0] === 'help') miHelp = d;
              if (m[0] === 'space') miSpace = d;
            });
            var hubBar = document.createElement('div');
            hubBar.className = 'bar';
            hubEl.appendChild(hubBar);
            var hubBarT = { k: 'win', w: HUB, el: hubBar };

            var tabApps = mk2('tab', '<div class="tt">APPS</div><div class="ag"></div>');
            var ag = tabApps.querySelector('.ag');
            NAMES.forEach(function (n, i) {
              var d = document.createElement('div'); d.className = 'ai';
              d.appendChild(logo(i));
              var sp = document.createElement('span'); sp.textContent = n; d.appendChild(sp);
              ag.appendChild(d);
              T_apps.push({ k: 'btn', el: d, fn: function () { openWin(i); } });
            });
            var tabHelp = mk2('tab', '<div class="tt">GESTOS</div><div class="hg">' +
              '<div class="hi"><span><b>Pinça</b> — toca e clica</span></div>' +
              '<div class="hi"><span><b>Dois dedos juntos</b> descendo, com o menu fechado — abre o menu</span></div>' +
              '<div class="hi"><span><b>Pinça na barra branca</b> e arrastar — move janela ou menu</span></div>' +
              '<div class="hi"><span><b>Pinça no canto</b> e puxar — muda o tamanho</span></div>' +
              '<div class="hi"><span><b>Toque duplo na barra</b> — minimiza a janela</span></div>' +
              '<div class="hi"><span><b>Punho fechado por 1 s</b> na janela — fecha a janela</span></div>' +
              '<div class="hi"><span><b>Dois dedos juntos</b> descendo pelo menu — fecha o menu</span></div>' +
              '<div class="hi"><span><b>Arrastar uma janela sobre outra</b> — agrupa (até 3); a <b>corrente</b> desagrupa</span></div>' +
              '<div class="hi"><span><b>Pinça por 1 s</b>, no modo espacial com vídeo — abre os controles do vídeo</span></div>' +
              '<div class="hi"><span><b>Dois dedos descendo fora do menu</b> — traz o menu para onde você olha</span></div></div>');
            var tabSpace = mk2('tab', '<div class="sh"><span>ESPACIAL</span><div class="sc"></div></div><div class="sg"></div>');
            tabApps.style.zIndex = 200; tabHelp.style.zIndex = 200; tabSpace.style.zIndex = 200;

            function updTabs() {
              tabApps.style.display = TAB === 'apps' ? 'flex' : 'none';
              tabHelp.style.display = TAB === 'help' ? 'flex' : 'none';
              tabSpace.style.display = TAB === 'space' ? 'flex' : 'none';
              miApps.classList.toggle('on', TAB === 'apps');
              miHelp.classList.toggle('on', TAB === 'help');
              miSpace.classList.toggle('on', TAB === 'space');
              if (window.SP && window.SP.onTab) window.SP.onTab(TAB === 'space');
            }
            function activeTab() { return TAB === 'apps' ? tabApps : (TAB === 'help' ? tabHelp : (TAB === 'space' ? tabSpace : null)); }
            function closeTab() { TAB = null; updTabs(); rebuild(); }
            function setTab(t) {
              TAB = (TAB === t) ? null : t; updTabs(); rebuild();
              if (TAB) {
                var hf = hwd(360, HUB.s, HUB.R) + hwd(760, HUB.s, HUB.R) + 3.25;
                var fz = freeAz(hf, HUB.az);
                if (fz !== null) HUB.taz = fz;
              }
            }

            function rebuild() {
              var t = [];
              if (!HUB.hidden) {
                t = t.concat(T_hub); t.push(hubBarT);
                if (TAB === 'apps') t = t.concat(T_apps);
                else if (TAB === 'space') t = t.concat(T_space);
              }
              WINS.forEach(function (W) { if (W.min) t.push(W.bubT); else if (!W.grp) t.push(W.barT); });
              GROUPS.forEach(function (G) { t.push(G.barT); t = t.concat(G.lks); });
              UI.T = t.concat(window.__TV || []);
            }
            function occ(ref) {
              var out = [];
              WINS.forEach(function (w) {
                if (w.min) return;
                var az = w.t0 ? w.taz : w.az, hf = Math.atan(720 * w.s / 2 / w.R) / D, c = angd(az, ref);
                out.push([c - hf - 2, c + hf + 2]);
              });
              return out;
            }
            function freeAz(half, ref) {
              var oc = occ(ref), cands = [0], best = null, bd = 1e9;
              oc.forEach(function (o) { cands.push(o[0] - half, o[1] + half); });
              cands.forEach(function (c) {
                if (Math.abs(c) > 50) return;
                var ok = oc.every(function (o) { return c + half <= o[0] || c - half >= o[1]; });
                if (ok && Math.abs(c) < bd) { bd = Math.abs(c); best = c; }
              });
              return best === null ? null : ref + best;
            }
            function showHub() {
              if (!HUB.hidden) return;
              if (performance.now() - lastHide < 1500) return;
              HUB.hidden = false; HUB.az = gaze.az; HUB.ev = clamp(gaze.el, -35, 35); HUB.off = 0; HUB.taz = null;
              var hn0 = document.getElementById('hint'); if (hn0) hn0.remove();
              var fz = freeAz(hwd(360, HUB.s, HUB.R) + 2, gaze.az); if (fz !== null) HUB.az = fz;
              TAB = null; updTabs();
              hubEl.style.display = '';
              document.body.classList.remove('vrh');
              rebuild();
            }
            function recenterHub() {
              var hf = TAB ? hwd(360, HUB.s, HUB.R) + hwd(760, HUB.s, HUB.R) + 3.25 : hwd(360, HUB.s, HUB.R) + 2;
              HUB.az = gaze.az; HUB.ev = clamp(gaze.el, -35, 35); HUB.taz = null;
              var fz = freeAz(hf, gaze.az); if (fz !== null) HUB.az = fz;
              lastRe = performance.now();
            }
            function hideHub() {
              HUB.hidden = true; TAB = null; updTabs();
              hubEl.style.display = 'none';
              document.body.classList.add('vrh');
              lastHide = performance.now();
              rebuild();
            }

            function mvOK(E) {
              if (!bp || bp.E !== E || bp.moved) return true;
              var h = window.handCursor || {};
              if (Math.hypot(h.x - bp.x, h.y - bp.y) > 28) { bp.moved = true; return true; }
              return false;
            }
            function mkMv(E) {
              return {
                get az() { return E.az; }, set az(v) { if (!E.grp && mvOK(E)) E.az = v; },
                get ev() { return E.ev; }, set ev(v) { if (!E.grp && mvOK(E)) E.ev = v; },
                get R() { return E.R; }, set R(v) { }
              };
            }
            function focusWin(W) {
              if (WINS[WINS.length - 1] === W) return;
              WINS.splice(WINS.indexOf(W), 1); WINS.push(W);
              nFront(W.id); rebuild();
            }
            function focusEnt(E) { if (E.list) E.list.slice().forEach(focusWin); else focusWin(E); }

            function syncLinks(G) {
              G.lks.forEach(function (e) { e.el.remove(); });
              G.lks = [];
              for (var i = 0; i < G.list.length - 1; i++) {
                (function (i) {
                  var d = mk2('lk', CHAIN);
                  G.lks.push({ k: 'btn', el: d, fn: function () { unlink(G, i); } });
                })(i);
              }
            }
            function mkGroup(list, s, R, ev, az) {
              var G = { list: list, s: s, R: R, ev: ev, az: az, sx: 0, sy: 0, lks: [] };
              G.bar = mk2('gbar', ''); G.rh = mk2('grh', '');
              G.mv = mkMv(G);
              G.barT = { k: 'win', w: G.mv, el: G.bar };
              GROUPS.push(G);
              var now = performance.now();
              list.forEach(function (W) {
                W.grp = G; W.t0 = 0; W.al = 1; W.k = 1; W.ga = now + 500;
                W.rh.style.display = 'none'; W.bar.style.display = 'none';
              });
              syncLinks(G);
              return G;
            }
